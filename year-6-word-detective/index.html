<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14283d"><title>Word Detective · Year 6 English</title><style>
:root{--navy:#14283d;--ink:#21364a;--gold:#ffcc69;--teal:#176b69;--paper:#fffcf4}*{box-sizing:border-box}body{margin:0;background:#eaf0f2;color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif;font-size:18px;line-height:1.5}button,input{font:inherit}button{cursor:pointer;border:0;min-height:52px;border-radius:12px;font-weight:bold;padding:12px 20px}button:hover:not(:disabled){filter:brightness(.95)}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #227bd0;outline-offset:4px}header{background:var(--navy);color:white;padding:18px 24px}.header-inner{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;letter-spacing:1px}.logo span{color:var(--gold)}.sound{background:#2a4057;color:white;font-size:14px;padding:10px 14px}main{max-width:980px;margin:30px auto;padding:0 20px}h1{font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-2px;margin:20px 0}h2{font-size:30px;line-height:1.2;margin:12px 0}p{margin:16px 0}.eyebrow{font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:var(--teal)}.hero{display:grid;grid-template-columns:1.25fr 1fr;border-radius:24px;background:var(--paper);overflow:hidden;box-shadow:0 8px 0 #d3dfe2}.copy{padding:38px}.art{background:#d9e7e6;display:grid;place-items:center;padding:20px}.art svg{width:100%;max-width:310px}.tag{background:#fff0cc;border-radius:20px;padding:7px 12px;font-size:14px;display:inline-block;font-weight:bold}.primary{background:var(--teal);color:white}.secondary{background:#e8eef0;color:var(--ink)}.example{margin:24px 0;padding:18px;background:#f1f3e9;border:1px dashed #a9bab1;border-radius:14px;font-size:16px}.example strong{letter-spacing:7px;display:block;color:var(--teal);margin-top:10px}.notes{color:#536977;font-size:16px}.status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:bold}.score{background:#fff0cc;padding:8px 15px;border-radius:22px}.track{height:8px;background:#cedbdd;border-radius:10px;margin:15px 0 24px;overflow:hidden}.bar{height:100%;background:var(--teal);transition:width .3s}.case{background:var(--paper);border:1px solid #d7e1e1;border-radius:24px;box-shadow:0 7px 0 #d3dfe2;overflow:hidden}.case-top{display:flex;align-items:center;gap:22px;padding:24px 30px;background:#deebe8}.case-top svg{width:90px;height:90px;flex-shrink:0}.case-top h2{margin:8px 0}.case-body{padding:30px}.clue{font-size:25px;line-height:1.4;margin:14px 0 24px;max-width:700px}.slots{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.slot{width:46px;height:54px;display:grid;place-items:center;border:2px solid #bfccce;border-bottom:4px solid #728e93;background:white;border-radius:9px;font-weight:bold;font-size:26px;text-transform:uppercase}.slot.fixed{background:var(--gold);border-color:#c49337}.slot.filled{border-color:var(--teal);color:var(--teal)}label{display:block;font-weight:bold;font-size:17px;margin-bottom:8px}input{width:100%;max-width:450px;padding:14px;border:2px solid #a7bdc1;border-radius:12px;min-height:56px;background:white;color:var(--ink);font-size:21px}input:disabled{background:#eff4ed}.form-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.feedback{margin-top:20px;border-radius:12px;padding:15px;background:#edf4df}.feedback:empty{display:none}.feedback.try{background:#fff0d9}.hint{color:#526b73;font-size:16px}.next{margin-top:20px}.map{display:flex;justify-content:center;gap:14px;margin:28px 0}.step{width:44px;height:44px;display:grid;place-items:center;background:white;border:2px solid #b6c9cc;border-radius:50%;font-weight:bold}.step.active{background:var(--gold);border-color:#c49337}.step.done{background:var(--teal);color:white;border-color:var(--teal)}.result{background:var(--paper);border-radius:24px;padding:35px;text-align:center}.result svg{width:150px}.big{font-size:68px;font-weight:900;margin:15px}.big span{font-size:27px;color:#5b6f79}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.review{display:grid;gap:16px;margin:24px 0}.review article{background:var(--paper);border:1px solid #d3dfe2;border-radius:16px;padding:24px}.answer{color:var(--teal);font-size:24px;font-weight:bold;letter-spacing:2px}.footer{text-align:center;font-size:13px;color:#5c727c;padding:20px}.celebrate{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.04)}}[hidden]{display:none!important}@media(max-width:600px){header{padding:12px}.logo{font-size:15px}.sound{font-size:13px;padding:10px}main{margin:18px auto;padding:0 12px}.hero{grid-template-columns:1fr}.copy{padding:25px}.art{padding:0}.art svg{height:160px}.case-top{padding:16px;gap:14px}.case-top svg{width:60px;height:60px}.case-top h2{font-size:24px}.case-body{padding:20px}.clue{font-size:22px}.slots{gap:6px}.slot{width:33px;height:46px;font-size:23px}input{max-width:none}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-actions .primary{grid-column:1/-1}.form-actions button{font-size:15px;padding:12px 8px}.next{width:100%}.result{padding:25px 18px}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.translation{background:#edf2f1;border-left:3px solid #8caeaa;border-radius:0 10px 10px 0;padding:12px 15px;font-size:17px;color:#3d5963;margin:0 0 24px}.translation span{display:block;font-size:12px;font-weight:bold;letter-spacing:1px;color:#176b69;margin-bottom:5px}.clue{margin-bottom:14px}.mission-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0}.category-map{background:#dce7e6;border-radius:16px;padding:15px 10px}.category-name{text-align:center;font-size:15px;font-weight:bold}.category-map .map{gap:6px;margin:12px 0 0}.category-map .step{width:36px;height:36px;font-size:14px}.slot.space{width:10px;border:0;background:transparent}.slots{gap:5px}.slot{width:35px;height:48px;font-size:23px}@media(max-width:600px){.mission-map{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.category-map{padding:12px 5px}.category-map .map{gap:4px}.category-map .step{width:27px;height:32px;font-size:12px}.slots{gap:3px}.slot{width:23px;height:39px;font-size:20px}.slot.space{width:7px}}</style></head><body><header><div class="header-inner"><div class="logo"><span>⌕</span> WORD DETECTIVE</div><button class="sound" id="sound" aria-pressed="false">Sound: off</button></div></header><main id="app"></main><footer class="footer">Year 6 English · Six vocabulary categories · By Mr. Z</footer><script>
'use strict';
const cases=[
{category:"Crime",number:21,title:'The Hidden Face',clue:'Something a robber might wear over their face.',malay:'Sesuatu yang mungkin dipakai oleh perompak untuk menutup muka mereka.',word:'mask',hint:'It covers the face. The word ends with k.',meaning:'A covering worn over the face.'},
{category:"Crime",number:22,title:'The Missing Piece',clue:'A piece of information or an object that helps someone solve a puzzle.',malay:'Maklumat atau objek yang membantu seseorang menyelesaikan teka-teki.',word:'clue',hint:'Detectives look for these to solve a mystery. The word ends with e.',meaning:'Information that helps solve a mystery or puzzle.'},
{category:"Crime",number:23,title:'The Stolen Treasure',clue:'An act of stealing money or things from a bank, shop, or museum.',malay:'Perbuatan mencuri wang atau barang dari bank, kedai atau muzium.',word:'robbery',hint:'Think of the word robber. Change its ending to make the name of the act.',meaning:'The act of stealing money or things from a place or person.'},
{category:"Crime",number:24,title:'Who Took It?',clue:'A person who steals things that do not belong to them',malay:'Seseorang yang mencuri barang yang bukan miliknya.',word:'thief',hint:'This person steals. The middle letters are ie.',meaning:'A person who steals.'},
{category:"Crime",number:25,title:'The Written Record',clue:'A policeman wrote down about what happened to the victims.',malay:'Seorang anggota polis mencatat perkara yang berlaku kepada mangsa.',word:'report',hint:'A written account of what happened. The word ends with t.',meaning:'A written account of an event.'},
{"category": "Animals", "number": 26, "title": "Animals Word 1", "clue": "A large animal with a long trunk.", "malay": "Haiwan besar yang mempunyai belalai panjang.", "word": "elephant", "hint": "It uses its trunk to pick up food.", "meaning": "A large animal with a trunk."},
{"category": "Animals", "number": 27, "title": "Animals Word 2", "clue": "An animal with a very long neck.", "malay": "Haiwan yang mempunyai leher yang sangat panjang.", "word": "giraffe", "hint": "It can reach leaves high in trees.", "meaning": "A tall animal with a long neck."},
{"category": "Animals", "number": 28, "title": "Animals Word 3", "clue": "An animal with black and white stripes.", "malay": "Haiwan yang mempunyai belang hitam dan putih.", "word": "zebra", "hint": "It looks like a striped horse.", "meaning": "An animal with black and white stripes."},
{"category": "Animals", "number": 29, "title": "Animals Word 4", "clue": "An insect with colourful wings that starts life as a caterpillar.", "malay": "Serangga bersayap berwarna-warni yang bermula sebagai ulat beluncas.", "word": "butterfly", "hint": "Its name ends with fly.", "meaning": "An insect with broad, often colourful wings."},
{"category": "Animals", "number": 30, "title": "Animals Word 5", "clue": "A black and white bird that cannot fly and lives in cold places.", "malay": "Burung hitam dan putih yang tidak boleh terbang dan hidup di tempat sejuk.", "word": "penguin", "hint": "It is a good swimmer.", "meaning": "A flightless bird adapted to swimming."},
{"category": "School", "number": 31, "title": "School Word 1", "clue": "A person who helps pupils learn in a classroom.", "malay": "Seseorang yang membantu murid belajar di dalam kelas.", "word": "teacher", "hint": "This person teaches lessons.", "meaning": "A person who teaches."},
{"category": "School", "number": 32, "title": "School Word 2", "clue": "A place where books are kept for people to read or borrow.", "malay": "Tempat buku disimpan untuk dibaca atau dipinjam.", "word": "library", "hint": "You borrow books from this place.", "meaning": "A place with books to read or borrow."},
{"category": "School", "number": 33, "title": "School Word 3", "clue": "A tool used to draw straight lines and measure length.", "malay": "Alat untuk melukis garisan lurus dan mengukur panjang.", "word": "ruler", "hint": "It often shows centimetres.", "meaning": "A tool for measuring and drawing straight lines."},
{"category": "School", "number": 34, "title": "School Word 4", "clue": "A small object used to rub out pencil marks.", "malay": "Objek kecil untuk memadam kesan tulisan pensel.", "word": "eraser", "hint": "Its name starts with erase.", "meaning": "An object that removes pencil marks."},
{"category": "School", "number": 35, "title": "School Word 5", "clue": "A book that explains the meanings of words.", "malay": "Buku yang menerangkan maksud perkataan.", "word": "dictionary", "hint": "Words in this book are in alphabetical order.", "meaning": "A reference book of words and their meanings."},
{"category": "Food", "number": 36, "title": "Food Word 1", "clue": "A meal eaten in the morning before the day begins.", "malay": "Hidangan yang dimakan pada waktu pagi sebelum memulakan hari.", "word": "breakfast", "hint": "Its name ends with fast.", "meaning": "The first meal of the day."},
{"category": "Food", "number": 37, "title": "Food Word 2", "clue": "Two slices of bread with a filling between them.", "malay": "Dua keping roti dengan inti di antaranya.", "word": "sandwich", "hint": "You can fill it with egg or cheese.", "meaning": "Bread with a filling between slices."},
{"category": "Food", "number": 38, "title": "Food Word 3", "clue": "A long yellow fruit that you peel before eating.", "malay": "Buah kuning yang panjang dan dikupas sebelum dimakan.", "word": "banana", "hint": "Its last four letters are nana.", "meaning": "A long fruit with a peel."},
{"category": "Food", "number": 39, "title": "Food Word 4", "clue": "A sweet frozen food often served in a cone.", "malay": "Makanan beku yang manis dan sering dihidangkan dalam kon.", "word": "ice cream", "hint": "The first word is ice.", "meaning": "A sweet frozen dessert."},
{"category": "Food", "number": 40, "title": "Food Word 5", "clue": "A list of food and drinks available in a restaurant.", "malay": "Senarai makanan dan minuman yang tersedia di restoran.", "word": "menu", "hint": "You read it before ordering food.", "meaning": "A list of available food and drinks."},
{"category": "Places", "number": 41, "title": "Places Word 1", "clue": "A place where doctors and nurses care for sick people.", "malay": "Tempat doktor dan jururawat merawat orang yang sakit.", "word": "hospital", "hint": "People go here for medical treatment.", "meaning": "A place providing medical treatment."},
{"category": "Places", "number": 42, "title": "Places Word 2", "clue": "A place where you can buy stamps and send letters.", "malay": "Tempat untuk membeli setem dan menghantar surat.", "word": "post office", "hint": "The first word is post.", "meaning": "A place for sending letters and parcels."},
{"category": "Places", "number": 43, "title": "Places Word 3", "clue": "A place where planes take off and land.", "malay": "Tempat kapal terbang berlepas dan mendarat.", "word": "airport", "hint": "Its name begins with air.", "meaning": "A place used by aircraft and passengers."},
{"category": "Places", "number": 44, "title": "Places Word 4", "clue": "A place where old objects and works of art are displayed.", "malay": "Tempat objek lama dan karya seni dipamerkan.", "word": "museum", "hint": "You can learn about history here.", "meaning": "A place that displays objects of interest."},
{"category": "Places", "number": 45, "title": "Places Word 5", "clue": "A large shop where you can buy groceries and household goods.", "malay": "Kedai besar untuk membeli barangan runcit dan keperluan rumah.", "word": "supermarket", "hint": "Its name starts with super.", "meaning": "A large shop selling food and household goods."},
{"category": "Jobs", "number": 46, "title": "Jobs Word 1", "clue": "A person who treats people who are ill.", "malay": "Seseorang yang merawat orang yang sakit.", "word": "doctor", "hint": "This person may work in a clinic or hospital.", "meaning": "A person trained to treat illness."},
{"category": "Jobs", "number": 47, "title": "Jobs Word 2", "clue": "A person who puts out fires and rescues people.", "malay": "Seseorang yang memadam kebakaran dan menyelamatkan orang.", "word": "firefighter", "hint": "The word starts with fire.", "meaning": "A person trained to fight fires."},
{"category": "Jobs", "number": 48, "title": "Jobs Word 3", "clue": "A person who cooks food in a restaurant.", "malay": "Seseorang yang memasak makanan di restoran.", "word": "chef", "hint": "This four-letter word ends with f.", "meaning": "A professional cook."},
{"category": "Jobs", "number": 49, "title": "Jobs Word 4", "clue": "A person who flies a plane.", "malay": "Seseorang yang menerbangkan kapal terbang.", "word": "pilot", "hint": "This person works in a cockpit.", "meaning": "A person who controls an aircraft."},
{"category": "Jobs", "number": 50, "title": "Jobs Word 5", "clue": "A person who grows crops or keeps animals for food.", "malay": "Seseorang yang menanam tanaman atau menternak haiwan untuk makanan.", "word": "farmer", "hint": "This person works on a farm.", "meaning": "A person who works on a farm."}
];
const icon='<svg viewBox="0 0 300 300" role="img" aria-label="A detective notebook and magnifying glass"><circle cx="150" cy="150" r="132" fill="#bdd4cf"/><rect x="72" y="62" width="135" height="184" rx="14" fill="#fffaf0" stroke="#25465b" stroke-width="6" transform="rotate(-8 140 154)"/><path d="M103 101h seventy"/><path d="M103 110h67m-67 26h67m-67 26h47" stroke="#a9c3bc" stroke-width="8" stroke-linecap="round"/><circle cx="185" cy="173" r="47" fill="#c5e9ed" fill-opacity=".65" stroke="#25465b" stroke-width="11"/><path d="m217 207 39 39" stroke="#25465b" stroke-width="22" stroke-linecap="round"/><path d="m167 153 8-12" stroke="white" stroke-width="7" stroke-linecap="round"/><circle cx="85" cy="244" r="19" fill="#ffcc69"/><path d="m80 244 5 5 9-11" stroke="#715726" stroke-width="4" fill="none"/></svg>'.replace('<path d="M103 101h seventy"/>','');
const app=document.getElementById('app');let state={screen:'start',index:0,score:0,records:[]},sound=false,audio;
function map(){return '<section class="mission-map" aria-label="Category progress">'+['Crime','Animals','School','Food','Places','Jobs'].map((name,g)=>'<div class="category-map"><div class="category-name">'+name+'</div><div class="map">'+cases.slice(g*5,g*5+5).map((c,j)=>{const i=g*5+j;return '<span class="step '+(state.records[i]?.complete?'done':state.screen==='game'&&i===state.index?'active':'')+'" '+(state.screen==='game'&&i===state.index?'aria-current="step"':'')+' aria-label="'+name+' case '+(j+1)+(state.records[i]?.complete?' completed':'')+'">'+(state.records[i]?.complete?'✓':i+1)+'</span>'}).join('')+'</div></div>').join('')+'</section>'}

function render(){
if(state.screen==='start')app.innerHTML='<section class="hero"><div class="copy"><span class="tag">YEAR 6 · ENGLISH CHALLENGE</span><h1>Every word<br>is a clue.</h1><p>Become a word detective! Explore 30 bilingual clues in six categories and complete each mystery word.</p><div class="example"><b>Example · Crime</b><br>An illegal action that can be punished by the police.<strong>C R I M E</strong></div><p class="notes">Crime · Animals · School · Food · Places · Jobs.<br><br>The first letter is given. Each box is one letter. Type the whole word or just the missing letters. Earn one mark for each correct first attempt.</p><button class="primary" id="start">START INVESTIGATION →</button></div><div class="art">'+icon+'</div></section>'+map();
if(state.screen==='game'){const c=cases[state.index],r=state.records[state.index];app.innerHTML='<div class="status"><span>CASE '+(state.index+1)+' OF '+cases.length+'</span><span class="score">★ '+state.score+' / '+cases.length+' marks</span></div><div class="track" role="progressbar" aria-label="Completed cases" aria-valuemin="0" aria-valuemax="'+cases.length+'" aria-valuenow="'+state.records.filter(x=>x.complete).length+'"><div class="bar" style="width:'+state.records.filter(x=>x.complete).length/cases.length*100+'%"></div></div><section class="case"><div class="case-top">'+icon+'<div><span class="eyebrow">'+c.category+' · CASE '+(state.index+1)+'</span><h2 id="heading" tabindex="-1">'+c.title+'</h2></div></div><div class="case-body"><div class="eyebrow">YOUR CLUE</div><p class="clue">'+c.clue+'</p><p class="translation" lang="ms"><span>Bahasa Melayu</span>'+c.malay+'</p><div class="slots" aria-label="'+c.word.replace(/ /g,'').length+' letters, starting with '+c.word[0].toUpperCase()+'">'+[...c.word].map((l,i)=>'<span aria-hidden="true" class="slot '+(l===' '?'space':!i?'fixed':r.complete?'filled':'')+'">'+(l===' '?'':!i||r.complete?l:'_')+'</span>').join('')+'</div><form id="answer-form"><label for="word">What is the word?</label><input id="word" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-describedby="help feedback" '+(r.complete?'disabled':'')+'><p id="help" class="hint">Starts with '+c.word[0].toUpperCase()+' · '+c.word.replace(/ /g,'').length+' letters. Whole word or missing letters accepted.</p><div class="form-actions"><button class="primary" type="submit" '+(r.complete?'disabled':'')+'>CHECK ANSWER</button><button class="secondary" type="button" id="hint" '+(r.complete?'disabled':'')+'>HINT (NO MARK)</button><button class="secondary" type="button" id="read">▶ READ CLUE</button></div></form><div class="feedback '+(!r.complete?'try':'')+'" id="feedback" role="status" aria-live="polite">'+(r.message||'')+'</div><button class="primary next" id="continue" '+(!r.complete?'hidden':'')+'>'+(state.index===cases.length-1?'SEE RESULTS':'NEXT CASE →')+'</button></div></section>'+map();if(r.complete)document.getElementById('word').value=c.word;configureSpeech()}
if(state.screen==='results')app.innerHTML='<section class="result">'+icon+'<p class="eyebrow">INVESTIGATION COMPLETE</p><h1 style="font-size:40px">Case closed, detective!</h1><div class="big">'+state.score+' <span>/ '+cases.length+' marks</span></div><p>You solved all 30 mystery words.<br>'+(state.score===cases.length?'Excellent vocabulary and spelling!':'Every clue helps you learn. Try again to build your score!')+'</p><div class="actions"><button id="again" class="primary">PLAY AGAIN</button><button id="review" class="secondary">REVIEW WORDS</button></div></section>'+map();
if(state.screen==='review')app.innerHTML='<span class="eyebrow">DETECTIVE’S WORD BOOK</span><h1 style="font-size:38px" id="heading" tabindex="-1">Your 30 discoveries</h1><div class="review">'+cases.map((c,i)=>'<article><span class="eyebrow">'+c.category+' · CASE '+(i+1)+' · '+(state.records[i].mark?'★ First attempt':'✓ Learned with help')+'</span><h2>'+c.title+'</h2><p>'+c.clue+'</p><p class="translation" lang="ms"><span>Bahasa Melayu</span>'+c.malay+'</p><div class="answer">'+c.word.toUpperCase()+'</div><p>'+c.meaning+'</p></article>').join('')+'</div><div class="actions"><button class="primary" id="again">PLAY AGAIN</button><button class="secondary" id="results">BACK TO RESULTS</button></div>';
}
function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function focusPage(){(document.getElementById('heading')||document.getElementById('again'))?.focus();window.scrollTo(0,0)}
function start(){stopSpeech();state={screen:'game',index:0,score:0,records:cases.map(()=>({complete:false,mark:false,attempts:0,hinted:false,message:''}))};render();focusPage()}
function beep(){if(!sound)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=740;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.start();o.stop(audio.currentTime+.22)}catch{}}
function check(value){if(state.screen!=='game')return;const c=cases[state.index],r=state.records[state.index];if(r.complete)return;const clean=value.trim().toLowerCase();if(!clean){document.getElementById('feedback').textContent='Type your answer first. You can do it!';document.getElementById('word').focus();return}const compact=clean.replace(/\s+/g,'');const valid=/^[a-z]+$/.test(compact);r.attempts++;if(valid&&(compact===c.word.replace(/ /g,'')||compact===c.word.slice(1).replace(/ /g,''))){r.complete=true;r.mark=r.attempts===1&&!r.hinted;if(r.mark)state.score++;r.message=r.mark?'★ Correct! You earned one mark.':'✓ Correct! You solved the clue. Keep learning!';beep();stopSpeech();render();document.querySelector('.case').classList.add('celebrate');document.getElementById('continue').focus()}else{r.message='Good try! Check the first letter and the number of letters, then try again.';document.getElementById('feedback').textContent=r.message;document.getElementById('word').select()}}
app.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();check(document.getElementById('word').value)}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='start'||b.id==='again')start();else if(b.id==='continue'&&state.records[state.index].complete){stopSpeech();if(state.index<cases.length-1)state.index++;else state.screen='results';render();focusPage()}else if(b.id==='review'||b.id==='results'){state.screen=b.id==='review'?'review':'results';render();focusPage()}else if(b.id==='hint'){const r=state.records[state.index];if(r.complete)return;r.hinted=true;r.message=cases[state.index].hint+' A hint makes this a practice case: no mark will be awarded.';document.getElementById('feedback').textContent=r.message;document.getElementById('word').focus()}else if(b.id==='read'){try{stopSpeech();const c=cases[state.index],u=new SpeechSynthesisUtterance(c.clue+' The word starts with '+c.word[0]+'. It has '+c.word.replace(/ /g,'').length+' letters.');u.lang='en-GB';u.rate=.85;window.speechSynthesis.speak(u)}catch{b.disabled=true;b.textContent='Reading unavailable'}}});
function configureSpeech(){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){const b=document.getElementById('read');b.disabled=true;b.textContent='Reading unavailable'}}
document.getElementById('sound').addEventListener('click',e=>{sound=!sound;e.target.textContent='Sound: '+(sound?'on':'off');e.target.setAttribute('aria-pressed',String(sound));if(sound)beep();else stopSpeech()});render();
</script></body></html>
