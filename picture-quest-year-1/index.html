return '<svg viewBox="0 0 400 330" role="img" aria-label="'+(extraArt[kind]?.label||{ball:'A small red toy ball',kart:'Misty driving a green go-kart',monster:'A drawing of a big purple monster',shapes:'Tangram puzzle with an empty triangle space',train:'A long colourful toy train',bike:'A toy bike',doll:'A doll inside a yellow bag beside a desk',hero:'A smiling explorer with a map and stars'}[kind])+'"><circle cx="200" cy="168" r="142" fill="#ffffff" opacity=".28"/>'+content+'</svg>';
}
function map(){return '<details class="map" '+(window.matchMedia('(min-width:601px)').matches?'open':'')+'><summary class="map-summary">Your mission map · '+state.records.filter(r=>r.complete).length+' / '+total+'</summary><div class="steps">'+questions.map((q,i)=>'<div class="step '+(state.records[i]?.complete?'done':state.screen==='game'&&state.index===i?'active':'')+'" '+(state.screen==='game'&&state.index===i?'aria-current="step"':'')+'><div class="orb">'+(state.records[i]?.complete?(state.records[i].star?'★':'✓'):i+1)+'</div>'+q.short+'</div>').join('')+'</div></details>'}
function render(){readButton.hidden=state.screen!=='game';
if(state.screen==='start')app.innerHTML='<section class="hero"><div class="hero-copy"><span class="badge">YEAR 1 • ENGLISH CHALLENGE</span><h1>PICTURE<br>QUEST<span style="color:#c78622"> ✦</span></h1><h2 style="font-size:24px">Small clues. Big discoveries.</h2><p>Join our little explorer! Read the stories, look at the pictures, and collect stars on 30 fun missions.</p><button class="primary" id="start">START GAME →</button><div class="rules"><span>📖 Read & choose</span><span>★ Collect 30 stars</span><span>↻ Try again & learn</span></div></div><div class="hero-art">'+illustration('hero')+'</div></section>'+map();
if(state.screen==='game'){const q=questions[state.index],r=state.records[state.index];app.innerHTML='<div class="status"><span>LEVEL '+(state.index+1)+' OF '+total+'</span><span class="score" aria-label="'+state.score+' stars out of '+total+'">★ '+state.score+' / '+total+' stars</span></div><div class="track" role="progressbar" aria-label="Completed missions" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+state.records.filter(x=>x.complete).length+'"><div class="fill" style="width:'+state.records.filter(x=>x.complete).length/total*100+'%"></div></div><section class="game-card"><div class="scene">'+illustration(q.art)+'<span class="scene-label">LOOK • READ • DISCOVER</span></div><div class="question-panel"><span class="eyebrow">QUESTION '+q.number+'</span><h2 id="heading" tabindex="-1">'+q.title+'</h2><div class="stimulus">'+q.text+'</div><h3 class="question">'+q.question+'</h3><div class="answers" role="group" aria-label="Choose an answer">'+q.answers.map((a,i)=>'<button class="answer '+(r.complete&&i===q.correct?'correct':r.wrong.includes(i)?'wrong':'')+'" data-answer="'+i+'" '+(r.complete||r.wrong.includes(i)?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+a+'</span></button>').join('')+'</div><div class="feedback" role="status" aria-live="polite">'+(r.complete?(r.star?'★ Well done! You earned a star!':'✓ You found it! Good reading. Keep going!'):r.wrong.length?'Good try! '+q.hint+' Try another answer.':'')+'</div><button id="continue" class="primary next" '+(!r.complete?'hidden':'')+'>'+(state.index===total-1?'SEE MY RESULTS':'CONTINUE →')+'</button></div></section>'+map();}
if(state.screen==='results')app.innerHTML='<section class="result"><span class="eyebrow">ADVENTURE COMPLETE</span><div style="max-width:210px;margin:auto">'+illustration('hero')+'</div><h1 style="font-size:44px">You did it, explorer!</h1><div class="result-stars" aria-hidden="true">'+questions.map((_,i)=>'<span>'+(i<state.score?'★':'☆')+'</span>').join('')+'</div><div class="big-score">'+state.score+' <span>/ '+total+' stars</span></div><p>You finished all 30 missions!<br>'+(state.score===total?'Wonderful reading. All 30 stars are yours!':'Every try helps you learn. Explore again to collect more stars!')+'</p><div class="actions"><button class="primary" id="again">PLAY AGAIN ↻</button><button class="secondary" id="review">REVIEW ANSWERS</button></div></section>'+map();
if(state.screen==='review')app.innerHTML='<span class="eyebrow">YOUR DISCOVERIES</span><h1 style="font-size:42px" tabindex="-1" id="heading">Let’s review the answers</h1><p>Read each story and find the clue.</p><div class="review-list">'+questions.map((q,i)=>'<article class="review-card"><span class="eyebrow">LEVEL '+(i+1)+' · QUESTION '+q.number+' · '+(state.records[i].star?'★ Star earned':'✓ Learned with a retry')+'</span><h3>'+q.title+'</h3><p>'+q.text+'</p><p><strong>'+q.question+'</strong></p><p class="correct-text">✓ '+String.fromCharCode(65+q.correct)+'. '+q.answers[q.correct]+'</p></article>').join('')+'</div><div class="actions"><button id="again" class="primary">PLAY AGAIN ↻</button><button id="results" class="secondary">BACK TO RESULTS</button></div>';
}
function stopReading(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function start(){stopReading();document.querySelectorAll('.confetti').forEach(c=>c.remove());state={screen:'game',index:0,score:0,records:questions.map(()=>({wrong:[],complete:false,star:false}))};render();focusHeading()}
function focusHeading(){(document.getElementById('heading')||document.getElementById('again'))?.focus();window.scrollTo({top:0,behavior:'instant'})}
function tone(success){if(muted)return;try{audioContext ||= new(window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.connect(gain);gain.connect(audioContext.destination);osc.frequency.setValueAtTime(success?660:330,audioContext.currentTime);osc.frequency.setValueAtTime(success?880:294,audioContext.currentTime+.12);gain.gain.setValueAtTime(.08,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.3);osc.start();osc.stop(audioContext.currentTime+.3)}catch{}}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<24;i++){const c=document.createElement('span');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#ffd766','#ee7c64','#469877','#a890d0'][i%4];c.style.animationDelay=Math.random()*.3+'s';document.body.append(c);setTimeout(()=>c.remove(),2000)}}
function answer(i){if(state.screen!=='game')return;const q=questions[state.index],r=state.records[state.index];if(r.complete||r.wrong.includes(i)||!Number.isInteger(i)||i<0||i>2)return;stopReading();if(i===q.correct){r.complete=true;r.star=r.wrong.length===0;if(r.star){state.score++;celebrate()}tone(true)}else{r.wrong.push(i);tone(false)}render();if(r.complete)document.getElementById('continue').focus();else app.querySelector('.answer:not(:disabled)').focus()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-answer'))answer(Number(b.dataset.answer));else if(b.id==='start'||b.id==='again')start();else if(b.id==='continue'&&state.records[state.index].complete){stopReading();if(state.index<total-1)state.index++;else{state.screen='results';celebrate()}render();focusHeading()}else if(b.id==='review'||b.id==='results'){stopReading();state.screen=b.id==='review'?'review':'results';render();focusHeading()}});
muteButton.addEventListener('click',()=>{muted=!muted;muteButton.textContent='Sound: '+(muted?'off':'on');muteButton.setAttribute('aria-pressed',String(muted));if(muted)stopReading();else tone(true)});
readButton.addEventListener('click',()=>{if(state.screen!=='game')return;const q=questions[state.index];try{stopReading();const u=new SpeechSynthesisUtterance(q.text+' '+q.question+' '+q.answers.map((a,i)=>String.fromCharCode(65+i)+'. '+a).join('. '));u.lang='en-GB';u.rate=.8;window.speechSynthesis.speak(u)}catch{readButton.textContent='Reading unavailable';readButton.disabled=true}});
if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){readButton.disabled=true;readButton.textContent='Read aloud unavailable'}
render();
</script></body></html>
