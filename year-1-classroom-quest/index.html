<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Quest · Year 1</title><style>*{box-sizing:border-box}body{margin:0;font:20px/1.5 Arial,sans-serif;color:#243457;background:#91d9ff}header{background:#6434b0;color:white;padding:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{max-width:850px;margin:24px auto;padding:0 14px}.card{background:#fffef6;border:3px solid #6434b0;border-radius:26px;padding:26px;box-shadow:0 7px #44237b}h1{font-size:clamp(32px,5vw,46px);line-height:1.2;color:#6434b0}h2{font-size:26px}button{font:inherit;font-weight:bold;border:2px solid transparent;background:#c94325;color:white;border-radius:16px;padding:14px 20px;min-height:56px;cursor:pointer}button:disabled{opacity:.65;cursor:default}button:focus-visible{outline:4px solid #171f42;outline-offset:4px}.secondary{background:#176bc0}.hero{text-align:center}.ms{background:#fff0bc;padding:14px;border-radius:14px}.objects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.object{background:#eee7ff;color:#30234e;border:3px solid #9060c8;min-height:135px}.object span{font-size:52px;display:block}.object.selected{background:#ffdf64;border-color:#a56c00}.scene{position:relative;background:#d9f2dc;border-radius:20px;padding:24px;min-height:160px;text-align:center;border-bottom:16px solid #c99663}.big{font-size:72px}.target{background:#087b4f;margin:12px;min-width:180px}.feedback{padding:16px;background:#fff0bc;border-radius:14px;margin:18px 0}.success{background:#d6f2d1}.hud{display:flex;justify-content:space-between;font-weight:bold;gap:10px}.bar{height:12px;background:#d3dfec;border-radius:12px;margin:14px 0;overflow:hidden}.bar span{display:block;height:100%;background:#158347}.score{font-size:56px;font-weight:bold;color:#6434b0}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}.review{padding:16px;background:#edf5ff;border-radius:16px;margin:14px 0}footer{text-align:center;padding:24px;font-size:16px}.pop{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:500px){.card{padding:18px}.objects{gap:8px}.object{padding:10px 4px;font-size:16px;min-height:112px}.object span{font-size:42px}.target{width:100%;margin:10px 0}.scene{padding:16px}}#runner{width:100%;max-height:58vh;aspect-ratio:600/540;display:block;border-radius:20px;border:3px solid #6434b0;touch-action:none}.runner-card{max-width:800px;margin:auto}.runner-help{font-size:16px}.runner-controls{display:grid;grid-template-columns:1fr 2fr 2fr 1fr;gap:8px;margin:14px 0}.runner-controls button{padding:12px 5px;font-size:16px;touch-action:manipulation}.runner-card details{margin:18px 0}.runner-card summary{cursor:pointer;font-weight:bold}.runner-card #checkpoint{margin-top:16px;width:100%}.runner-card #checkpoint:disabled{background:#687386}.runner-card #run-status{font-size:15px;flex:1}@media(max-width:500px){.runner-controls{position:sticky;bottom:8px;background:#fffef5ed;padding:8px;border-radius:16px;z-index:3}#runner{max-height:none}.runner-card{padding:14px}}

const questions=[["Sit at your desk, please.", "Sila duduk di meja kamu.", "desk", "🪑", "Tap the desk.", ["desk", "bag", "book"]], ["Open your book, please.", "Sila buka buku kamu.", "book", "📖", "Tap the book to open it.", ["book", "pen", "bag"]], ["Close your bag, please.", "Sila tutup beg kamu.", "bag", "🎒", "Tap the bag to close it.", ["ruler", "bag", "pen"]], ["Pass me a pen, please.", "Tolong berikan saya sebatang pen.", "pen", "🖊️", "Choose the pen, then tap the teacher.", ["pencil", "book", "pen"]], ["Put away your book, please.", "Sila simpan buku kamu.", "book", "📕", "Choose the book, then tap the school bag.", ["pen", "book", "ruler"]], ["Take out your ruler, please.", "Sila keluarkan pembaris kamu.", "ruler", "📏", "Tap the pencil case to take out the ruler.", ["ruler", "book", "pen"]], ["Pass me a pencil, please.", "Tolong berikan saya sebatang pensel.", "pencil", "✏️", "Choose the pencil, then tap the teacher.", ["pen", "pencil", "ruler"]], ["Open your bag, please.", "Sila buka beg kamu.", "bag", "🎒", "Tap the bag to open it.", ["book", "bag", "desk"]]];const icons={desk:'🪑',bag:'🎒',book:'📕',pen:'🖊️',pencil:'✏️',ruler:'📏'};let screen='start',index=0,score=0,records=[],selected='',hint='',done=false;const app=document.querySelector('#app');
const SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxVu9Qa9fH0zXRZgLevj3jVNa0pGYHc3o0hv9IJlg_oncROuaJaHCtWfnvfhRA5kcOTsg/exec';let pupil={name:'',pupilClass:''},attempt=null,bridge=null,bridgeTimer=null;
function recordingMessage(){
const box=document.getElementById('recording-status');if(!box)return;
box.textContent=!SCORE_ENDPOINT?'Score recording is not connected yet. Your result has not been sent.':attempt?.status==='saved'?'✓ Your score has been recorded for Mr. Z.':attempt?.status==='failed'?'Your score is waiting to be sent. Reconnecting automatically…':'Sending your score to Mr. Z…';
}
function completeRecording(){
if(!attempt||attempt.payload)return;
attempt.finished=new Date().toISOString();
attempt.payload={id:attempt.id,name:pupil.name,pupilClass:pupil.pupilClass,started:attempt.started,finished:attempt.finished,answers:records.map((r,i)=>({correctFirst:!r.wrong,answer:questions[i][2]}))};
if(SCORE_ENDPOINT)sendScore();
}
function sendScore(){
if(!attempt?.payload||attempt.status==='saved'||!SCORE_ENDPOINT||!navigator.onLine)return;
if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(SCORE_ENDPOINT)){attempt.status='failed';recordingMessage();return}
clearTimeout(bridgeTimer);bridge?.remove();attempt.status='sending';recordingMessage();
bridge=document.createElement('iframe');bridge.hidden=true;bridge.title='Private score submission';bridge.src=SCORE_ENDPOINT+'?channel='+encodeURIComponent(attempt.id)+'&parentOrigin='+encodeURIComponent(location.origin);document.body.append(bridge);
bridgeTimer=setTimeout(()=>{if(attempt?.status==='saved')return;attempt.status='failed';recordingMessage();if(attempt.retries++<3)bridgeTimer=setTimeout(sendScore,10000)},30000);
}
window.addEventListener('message',e=>{
if(!attempt||!bridge||!e.data||e.data.channel!==attempt.id||!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin))return;
if(e.data.type==='score-ready')e.source.postMessage({type:'save-score',channel:attempt.id,payload:attempt.payload},e.origin);
else if(e.data.type==='score-saved'&&e.data.result?.ok&&e.data.result.id===attempt.id&&e.data.result.score===score){attempt.status='saved';clearTimeout(bridgeTimer);recordingMessage()}
else if(e.data.type==='score-error'){attempt.status='failed';recordingMessage()}
});
window.addEventListener('online',()=>{if(attempt?.status!=='saved')sendScore()});



function listen(){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(questions[index][0]);u.lang='en-GB';u.rate=.75;window.speechSynthesis.speak(u)}
function beginClassroom(){clearTimeout(bridgeTimer);bridge?.remove();bridge=null;attempt={id:crypto.randomUUID?.()||("attempt-"+Date.now()+"-"+Math.random().toString(36).slice(2)),started:new Date().toISOString(),status:"idle",payload:null,retries:0};records=questions.map(()=>({wrong:false,star:false}));index=0;score=0;screen='run';reset();resetRunner();render()}
function reset(){selected='';hint='';done=false}
function wrong(){records[index].wrong=true;hint='Try again! Look for the '+questions[index][2]+'.';render(false);document.querySelector('#feedback').focus()}
function finish(){if(done)return;done=true;records[index].star=!records[index].wrong;if(records[index].star)score++;hint='Well done! '+questions[index][0];render(false);document.querySelector('#feedback').focus()}
function choose(word){if(done)return;if(word!==questions[index][2]){wrong();return}if([3,4,5,6].includes(index)){selected=word;hint='Good choice! Now tap '+(index===4?'the school bag.':index===5?'the pencil case.':'the teacher.');render(false);document.querySelector('#target')?.focus()}else finish()}
const taskPrompts=[
['Where should you sit?','Kamu perlu duduk di mana?','Tap ONE picture below.','Tekan SATU gambar di bawah.'],
['What should you open?','Apakah yang perlu kamu buka?','Tap ONE picture below.','Tekan SATU gambar di bawah.'],
['What should you close?','Apakah yang perlu kamu tutup?','Tap ONE picture below.','Tekan SATU gambar di bawah.'],
['What does the teacher want?','Apakah yang cikgu mahu?','Step 1: Tap the correct school thing.','Langkah 1: Tekan benda yang betul.'],
['What should you put away?','Apakah yang perlu kamu simpan?','Step 1: Tap the correct school thing.','Langkah 1: Tekan benda yang betul.'],
['What should you take out?','Apakah yang perlu kamu keluarkan?','Step 1: Tap the correct school thing.','Langkah 1: Tekan benda yang betul.'],
['What does the teacher want?','Apakah yang cikgu mahu?','Step 1: Tap the correct school thing.','Langkah 1: Tekan benda yang betul.'],
['What should you open?','Apakah yang perlu kamu buka?','Tap ONE picture below.','Tekan SATU gambar di bawah.']];
function taskGuide(){if(done)return '<div class="task-guide">✅ Task complete! / Tugasan selesai!</div>';let t=taskPrompts[index];if(selected)return '<div class="task-guide"><strong>Step 2: '+(index===4?'Tap the bag to put the book away.':index===5?'Tap the pencil case to take out the ruler.':'Tap the teacher to give her the '+selected+'.')+'</strong><p lang="ms">Langkah 2: '+(index===4?'Tekan beg untuk menyimpan buku.':index===5?'Tekan bekas pensel untuk mengeluarkan pembaris.':'Tekan cikgu untuk memberikan '+(index===3?'pen':'pensel')+'.')+'</p></div>';return '<div class="task-guide"><strong>'+t[0]+'</strong><p lang="ms">'+t[1]+'</p><span>'+t[2]+'</span><br><span lang="ms">'+t[3]+'</span></div>'}
function render(focus=true){window.speechSynthesis?.cancel();let q=questions[index],h='';if(screen==='start')h='<section class="card hero"><p>YEAR 1 · CLASSROOM INSTRUCTIONS</p><h1>Listen. Choose. Do!</h1><div class="big">👩‍🏫 🎒 📚</div><p>Help in the classroom!<br>Tap school things and follow the instructions.</p><p>⭐ Get a star for each correct first try.<br>Eight little classroom missions!</p><button id="start">LET’S PLAY →</button></section>';if(screen==='game'){let action=[3,4,5,6].includes(index)?'move':'tap';h='<section class="card"><div class="hud"><span>Mission '+(index+1)+' / 8</span><span>⭐ '+score+' / 8</span></div><div class="bar" role="progressbar" aria-label="Completed missions" aria-valuemin="0" aria-valuemax="8" aria-valuenow="'+(index+(done?1:0))+'"><span style="width:'+(index+(done?1:0))/8*100+'%"></span></div><p class="teacher-label">👩‍🏫 Teacher says / Cikgu berkata:</p><h2 tabindex="-1" id="heading">“'+q[0]+'”</h2><p class="ms" lang="ms">'+q[1]+'</p><button id="listen" class="secondary">🔊 Listen / Dengar</button>'+taskGuide()+'<div class="scene '+(done?'pop':'')+'">'+(done?'<div class="big">'+(index===1?'📖':q[3])+' ✅</div><strong>'+(['At the desk!','Book open!','Bag closed!','Here you are!','Book in the bag!','Ruler out!','Here you are!','Bag open!'][index])+'</strong>':action==='case'?'<button id="case" class="target"><span class="big">👝</span><br>Open pencil case</button>':'<span class="big">👩‍🏫</span><p>Listen to the teacher. Then choose below.<br><small lang="ms">Dengar arahan cikgu. Kemudian pilih di bawah.</small></p>')+'</div>'+(action==='case'?'': '<div class="objects">'+q[5].map(w=>'<button class="object '+(selected===w?'selected':'')+'" data-word="'+w+'" '+(done?'disabled':'')+'><span aria-hidden="true">'+icons[w]+'</span>'+w+'<small>Tap / Tekan</small></button>').join('')+'</div>')+(selected&&!done?'<button class="target" id="target">'+(index===4?'🎒 TAP THE BAG · Tekan beg':index===5?'👝 TAP THE PENCIL CASE · Tekan bekas pensel':'👩‍🏫 TAP THE TEACHER · Tekan cikgu')+'</button>':'')+(hint?'<div role="status" tabindex="-1" id="feedback" class="feedback '+(done?'success':'')+'">'+hint+'</div>':'')+(done?'<button id="next">'+(index===7?'SEE MY STARS':'NEXT →')+'</button>':'')+'</section>'}if(screen==='results')h='<section class="card hero"><h1>Classroom champion!</h1><div class="big">🏆</div><div class="score">'+score+' / 8 ⭐</div><p>You completed all eight missions!</p><div class="actions"><button id="again">PLAY AGAIN</button><button id="review" class="secondary">REVIEW</button></div></section>';if(screen==='review')h='<section class="card"><h1>Our classroom words</h1>'+questions.map((q,i)=>'<article class="review"><strong>'+q[0]+'</strong><p lang="ms">'+q[1]+'</p><p>'+q[3]+' '+q[2]+' '+(records[i].star?'⭐':'✓')+'</p></article>').join('')+'<div class="actions"><button id="again">PLAY AGAIN</button><button id="back" class="secondary">BACK TO STARS</button></div></section>';app.innerHTML=h;for(const id of ['start','again'])document.getElementById(id)?.addEventListener('click',start);document.querySelector('#listen')?.addEventListener('click',listen);if(!window.speechSynthesis&&document.querySelector('#listen')){document.querySelector('#listen').disabled=true;document.querySelector('#listen').textContent='Read aloud unavailable'}document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>choose(b.dataset.word));document.querySelector('#target')?.addEventListener('click',finish);document.querySelector('#case')?.addEventListener('click',finish);document.querySelector('#next')?.addEventListener('click',()=>{if(!done)return;if(index===7)screen='results';else {index++;reset();screen='run';resetRunner()}render()});document.querySelector('#review')?.addEventListener('click',()=>{screen='review';render()});document.querySelector('#back')?.addEventListener('click',()=>{screen='results';render()});if(focus){window.scrollTo(0,0);let el=document.querySelector('#heading')||app.querySelector('h1');el?.setAttribute('tabindex','-1');el?.focus({preventScroll:true})}}

let lane=1,runnerDistance=0,runnerStars=0,runItems=[],runTimer=0,runFrame=0,runLast=0,runPaused=false,stumble=0,runJump=0,runSlide=0,spawn=0,collectFlash=0,runStartStars=0;
function resetRunner(){collectFlash=0;runStartStars=runnerStars;lane=1;runnerDistance=0;runItems=[];runTimer=0;runPaused=false;stumble=0;runJump=0;runSlide=0;spawn=0}
function moveLane(dir){if(screen==='run'&&!runPaused)lane=Math.max(0,Math.min(2,lane+dir))}
function jumpRunner(){if(screen==='run'&&!runPaused&&runJump<=0)runJump=.85}
function slideRunner(){if(screen==='run'&&!runPaused)runSlide=.8}
function openTask(){screen='game';render()}
const renderReading=render;
render=function(focus=true){cancelAnimationFrame(runFrame);if(screen==='pupil'){app.innerHTML='<section class="card hero"><h1>Hello, runner!</h1><p>Enter your name and class.<br><span lang="ms">Isi nama dan kelas kamu.</span></p><form id="pupil-form"><label for="pupil-name">Name / Nama</label><input id="pupil-name" required maxlength="80" autocomplete="name" value="'+pupil.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"><label for="pupil-class">Class / Kelas</label><input id="pupil-class" required maxlength="40" placeholder="1 UTHM" value="'+pupil.pupilClass.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"><button>LET’S PLAY →</button></form></section>';document.querySelector('#pupil-form').onsubmit=e=>{e.preventDefault();let name=document.querySelector('#pupil-name').value.trim(),cl=document.querySelector('#pupil-class').value.trim();if(!name||!cl)return;pupil={name,pupilClass:cl};launchClassroom()};return}if(screen!=='run'){renderReading(focus);if(screen==='results'){completeRecording();app.querySelector('.score').insertAdjacentHTML('afterend','<p>🪙 '+runnerStars+' running coins collected</p><div id="recording-status" role="status" aria-live="polite"></div>');recordingMessage()}if(screen==='start'){document.querySelector('#start').textContent='START CLASSROOM RUN →';app.querySelector('h1').textContent='Classroom Dash!';app.querySelector('.big').textContent='🏃 🎒 ⭐';app.querySelectorAll('p')[1].innerHTML='Run through the school!<br>Dodge obstacles, collect stars and complete classroom tasks.'}return}
app.innerHTML='<section class="card runner-card"><div class="hud"><span>🏃 Run '+(index+1)+' / 8</span><span id="run-stars">🪙 '+runnerStars+'</span></div><h2>Race to the classroom!</h2><p class="runner-help">← → Change lanes · ↑ Jump · ↓ Slide<br>Phone: swipe or use the buttons.</p><canvas id="runner" width="600" height="540" tabindex="0" aria-label="Three-lane school runner. Left and right change lanes. Up jumps over boxes, Down slides under banners. Use Open classroom task to bypass running."></canvas><div class="runner-controls"><button id="left" aria-label="Move left">←</button><button id="jump">JUMP ↑</button><button id="slide">SLIDE ↓</button><button id="right" aria-label="Move right">→</button></div><div class="hud"><span id="run-status" role="status">Collect coins. Change lanes to avoid trains!</span><button id="pause-run" class="secondary">Pause</button></div><button id="checkpoint" disabled>Run to the checkpoint →</button><details><summary>Prefer the classroom task?</summary><button id="skip-run">OPEN CLASSROOM TASK</button></details></section>';
const cv=document.querySelector('#runner');let down=null;cv.onpointerdown=e=>{e.preventDefault();down={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};cv.onpointerup=e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);else if(dy<0)jumpRunner();else slideRunner()};cv.onpointercancel=()=>down=null;
document.querySelector('#left').onclick=()=>moveLane(-1);document.querySelector('#right').onclick=()=>moveLane(1);document.querySelector('#jump').onclick=jumpRunner;document.querySelector('#slide').onclick=slideRunner;document.querySelector('#pause-run').onclick=function(){runPaused=!runPaused;this.textContent=runPaused?'Resume':'Pause'};document.querySelector('#skip-run').onclick=openTask;document.querySelector('#checkpoint').onclick=openTask;runLast=0;runFrame=requestAnimationFrame(runnerTick);if(focus){window.scrollTo(0,0);cv.focus({preventScroll:true})}}
function start(){screen="pupil";render()}function launchClassroom(){runnerStars=0;beginClassroom()}
window.addEventListener('keydown',e=>{if(screen!=='run'||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))return;e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft')moveLane(-1);if(e.key==='ArrowRight')moveLane(1);if(e.key==='ArrowUp'||e.key===' ')jumpRunner();if(e.key==='ArrowDown')slideRunner()});document.addEventListener('visibilitychange',()=>{runLast=0;if(screen==='run'&&document.hidden){runPaused=true;document.querySelector('#pause-run').textContent='Resume'}});
function runnerTick(t){if(screen!=='run')return;let dt=Math.min(.04,(t-(runLast||t))/1000);runLast=t;if(!runPaused&&!document.hidden)stepRunner(dt);drawRunner();runFrame=requestAnimationFrame(runnerTick)}
function stepRunner(dt){collectFlash=Math.max(0,collectFlash-dt);stumble=Math.max(0,stumble-dt);runJump=Math.max(0,runJump-dt);runSlide=Math.max(0,runSlide-dt);if(runnerDistance>=100)return;runTimer+=dt;runnerDistance=Math.min(100,runnerDistance+dt*5);spawn-=dt;if(spawn<=0){let l=Math.floor(Math.random()*3);runItems.push({lane:l,z:0,type:'star',hit:false});if(runTimer>2)runItems.push({lane:(l+1+Math.floor(Math.random()*2))%3,z:0,type:Math.random()<.28?'train':Math.random()<.5?'box':'banner',hit:false});spawn=1.3-index*.055}for(const item of runItems){item.z+=dt*(.36+index*.012);if(!item.hit&&item.z>=.86&&item.z<1.15){item.hit=true;if(item.lane===lane){if(item.type==='star'){runnerStars++;collectFlash=.6;document.querySelector('#run-stars').textContent='🌟 '+runnerStars}else if(item.type==='train'){runnerStars=runStartStars;resetRunner();document.querySelector('#run-stars').textContent='🪙 '+runnerStars;document.querySelector('#run-status').textContent='Train hit! This run is starting again. Change lanes to avoid trains.';return}else if(stumble<=0&&!(item.type==='box'&&runJump>0)&&!(item.type==='banner'&&runSlide>0)){stumble=1;document.querySelector('#run-status').textContent='Oops! Keep going—try another lane, jump or slide.'}}}}runItems=runItems.filter(i=>i.z<1.15);if(runnerDistance>=100){document.querySelector('#checkpoint').disabled=false;document.querySelector('#checkpoint').textContent='CLASSROOM REACHED · OPEN TASK →';document.querySelector('#run-status').textContent='You made it! Complete your classroom task.'}}
function drawRunner(){const cv=document.querySelector('#runner');if(!cv)return;const c=cv.getContext('2d');c.fillStyle='#68c9ff';c.fillRect(0,0,600,540);c.fillStyle='#ffe16b';c.beginPath();c.arc(510,60,30,0,7);c.fill();c.fillStyle='#b4e78b';c.fillRect(0,155,600,385);for(let side of [0,1])for(let n=0;n<4;n++){let x=side?490:20,y=135+n*85;c.fillStyle=n%2?'#8e66cf':'#ea915d';c.fillRect(x,y,90,72);c.fillStyle='#fff1b0';c.fillRect(x+15,y+12,20,24);c.fillRect(x+50,y+12,20,24)}c.fillStyle='#6576a3';c.beginPath();c.moveTo(245,140);c.lineTo(355,140);c.lineTo(550,540);c.lineTo(50,540);c.fill();c.strokeStyle='#ffdf66';c.lineWidth=4;for(let n of [1,2]){c.beginPath();c.moveTo(245+n*110/3,140);c.lineTo(50+n*500/3,540);c.stroke()}for(let l=0;l<3;l++){for(let side of [-1,1]){c.strokeStyle='#d3e2ed';c.lineWidth=4;c.beginPath();c.moveTo(300+(l-1)*110/3+side*8,140);c.lineTo(300+(l-1)*500/3+side*55,540);c.stroke()}for(let k=0;k<12;k++){let z=((k/12+runTimer*.22)%1),w=110+390*z,x=300+(l-1)*w/3,y=140+400*z*z;c.strokeStyle='#553e30';c.lineWidth=3+z*6;c.beginPath();c.moveTo(x-12-z*45,y);c.lineTo(x+12+z*45,y);c.stroke()}}c.fillStyle='#514e64';c.fillRect(420,115,8,120);c.fillStyle='#e2b22f';c.fillRect(406,95,36,65);c.fillStyle='#23d36b';c.beginPath();c.arc(424,110,10,0,7);c.fill();c.fillStyle='#a02b28';c.beginPath();c.arc(424,142,10,0,7);c.fill();c.fillStyle='#6434b0';c.fillRect(230,95,140,45);c.fillStyle='white';c.font='bold 18px Arial';c.textAlign='center';c.fillText('SCHOOL STOP',300,123);for(const i of [...runItems].sort((a,b)=>a.z-b.z)){let z=Math.min(i.z,1.1),w=110+390*z,x=300+(i.lane-1)*w/3,y=140+370*z*z,size=15+35*z;c.save();c.translate(x,y);if(i.type==='star'){c.fillStyle='#ffcf28';c.strokeStyle='#bc790c';c.lineWidth=3;c.beginPath();c.ellipse(0,-size*.35,size*.38,size*.5,0,0,7);c.fill();c.stroke();c.fillStyle='#b57500';c.font='bold '+size*.65+'px Arial';c.fillText('★',0,-size*.12)}if(i.type==='train'){c.fillStyle='#1d77c2';c.fillRect(-size*.65,-size*2.4,size*1.3,size*2.4);c.fillStyle='#ffd641';c.fillRect(-size*.65,-size*.65,size*1.3,size*.35);c.fillStyle='#c4f1ff';c.fillRect(-size*.45,-size*2.1,size*.9,size*.7);c.fillStyle='#fff6ae';for(let k of [-1,1]){c.beginPath();c.arc(k*size*.38,-size*.38,size*.1,0,7);c.fill()}c.fillStyle='#243457';c.fillRect(-size*.7,-size*.08,size*1.4,size*.16)}if(i.type==='box'){c.fillStyle='#c76d2c';c.fillRect(-size/2,-size,size,size);c.strokeStyle='#ffe0a1';c.lineWidth=3;c.strokeRect(-size/2,-size,size,size)}if(i.type==='banner'){c.fillStyle='#d63e47';c.fillRect(-size*.65,-size*1.5,size*1.3,size*.5);c.fillStyle='#633c27';c.fillRect(-size*.65,-size,size*.1,size);c.fillRect(size*.55,-size,size*.1,size)}c.restore()}let x=300+(lane-1)*145,y=480-(runJump>0?Math.sin(runJump/.85*Math.PI)*90:0);c.save();if(collectFlash>0){c.save();c.globalAlpha=.35+.3*Math.sin(collectFlash*35);c.fillStyle='#ffe66b';c.shadowColor='#ffdf38';c.shadowBlur=28;c.beginPath();c.ellipse(x,y-25,49,78,0,0,7);c.fill();c.restore();c.fillStyle='#ffdb35';c.font='28px Arial';c.fillText('✦',x-45,y-65);c.fillText('✦',x+45,y-30)}if(stumble>0)c.globalAlpha=.5;let slide=runSlide>0;c.translate(x,y);if(slide)c.scale(1,.55);c.fillStyle='#173a51';c.fillRect(-19,6,14,30);c.fillRect(6,6,14,30);c.fillStyle='#e7e8ed';c.fillRect(-23,-38,46,47);c.fillStyle='#168e72';c.fillRect(-18,-35,36,34);c.fillStyle='#ffce35';c.fillRect(-12,-30,24,22);c.fillStyle='#6434b0';c.fillRect(-8,-24,16,5);c.fillStyle='#f1be94';c.beginPath();c.arc(0,-58,24,0,7);c.fill();c.fillStyle='#eeeef2';c.beginPath();c.arc(0,-65,25,Math.PI,7);c.fill();c.fillStyle='#df3c32';c.fillRect(-24,-82,48,12);c.fillRect(-10,-88,32,10);c.fillStyle='#176bc0';c.fillRect(-24,32,22,9);c.fillRect(3,32,22,9);c.restore();c.fillStyle='#fff';c.fillRect(15,15,160,15);c.fillStyle='#18874b';c.fillRect(15,15,runnerDistance*1.6,15);if(runPaused){c.fillStyle='#173a5188';c.fillRect(0,0,600,540);c.fillStyle='white';c.font='bold 36px Arial';c.fillText('PAUSED',300,270)}c.textAlign='start'}
render();</script></html>
