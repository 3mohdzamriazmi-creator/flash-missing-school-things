const sets=[{"title": "From Legends to Songs", "theme": "Music & Legends", "icon": "🎸", "color": "#7438b8", "text": "Martin Stark loved traditional folk songs because they told stories about history. When he was young, he {0} to write a song about the legend of Robin Hood.\n\nHe practiced the guitar every single day and performed for his friends. His catchy songs were loved {1} many people in his town, and his friends often asked him to play again. Martin wanted to share his music online so that people in other countries could hear {2} too.\n\nNow, Martin is preparing for an exciting new project. He is {3} to learn how to play the accordion next year so that he can travel and perform around the world.", "qs": [[["decide", "decided", "deciding"], 1, "“When he was young” tells us this happened in the past. Use “decided”.", "“Ketika dia masih muda” menunjukkan masa lalu. Gunakan “decided”."], [["by", "for", "with"], 0, "In the passive phrase “were loved by”, “by” introduces the people who loved the songs.", "Dalam frasa pasif “were loved by”, “by” memperkenalkan orang yang menyukai lagu itu."], [["it", "him", "them"], 0, "“It” refers to his music. “Music” is uncountable and takes “it”.", "“It” merujuk kepada muziknya. “Music” ialah kata nama tidak boleh bilang."], [["go", "goes", "going"], 2, "Use “is going to” for a future plan.", "Gunakan “is going to” untuk rancangan masa hadapan."]]}, {"title": "The School Garden", "theme": "Nature & Gardening", "icon": "🌱", "color": "#167448", "text": "Last Saturday, Aina {0} some seeds in the school garden. Her friends helped her prepare the soil.\n\nThey carried water {1} small buckets. Aina put the seeds in neat rows and watered {2} carefully.\n\nNext week, the gardening club is going to {3} signs beside the plants. Everyone is excited to see the first green leaves.", "qs": [[["plants", "planted", "planting"], 1, "“Last Saturday” needs the past tense: “planted”.", "“Sabtu lalu” memerlukan kata kerja masa lalu: “planted”."], [["in", "on", "at"], 0, "Water is carried inside buckets, so use “in”.", "Air dibawa di dalam baldi, jadi gunakan “in”."], [["it", "him", "them"], 2, "“Seeds” is plural, so the matching object pronoun is “them”.", "“Seeds” ialah jamak, jadi kata ganti objek yang sesuai ialah “them”."], [["make", "made", "making"], 0, "Use the base verb after “going to”: “make”.", "Gunakan kata kerja bentuk asas selepas “going to”: “make”."]]}, {"title": "A Race to Remember", "theme": "Sport & Teamwork", "icon": "🏃", "color": "#ba4029", "text": "Yesterday, Ravi {0} in the school relay race. He was nervous, but his teammates encouraged him.\n\nHe passed the baton {1} his friend safely. The crowd cheered because {2} were running very fast.\n\nThe team did not win, but they were proud. They will {3} together again tomorrow and try to improve.", "qs": [[["runs", "running", "ran"], 2, "“Yesterday” signals the past. The past tense of “run” is “ran”.", "“Semalam” menunjukkan masa lalu. Bentuk lampau “run” ialah “ran”."], [["to", "by", "on"], 0, "We pass something “to” another person.", "Kita menyerahkan sesuatu “to” orang lain."], [["he", "they", "it"], 1, "“They” refers to Ravi and his teammates.", "“They” merujuk kepada Ravi dan rakan sepasukannya."], [["trained", "training", "train"], 2, "After “will”, use the base form “train”.", "Selepas “will”, gunakan bentuk asas “train”."]]}, {"title": "The Helpful Robot", "theme": "Science & Invention", "icon": "🤖", "color": "#126dba", "text": "Mei and her brother {0} a small robot last month. It could move around their living room.\n\nThey made its body {1} recycled boxes. Their teacher asked {2} to bring the robot to the science fair.\n\nMei is now {3} a new programme so that the robot can follow a black line on the floor.", "qs": [[["build", "built", "building"], 1, "“Last month” needs the past form “built”.", "“Bulan lalu” memerlukan bentuk lampau “built”."], [["from", "at", "under"], 0, "“Made from” tells us the material used.", "“Made from” memberitahu bahan yang digunakan."], [["they", "their", "them"], 2, "After “asked”, use the object pronoun “them”.", "Selepas “asked”, gunakan kata ganti objek “them”."], [["write", "writes", "writing"], 2, "“Is now” is followed by an -ing verb: “writing”.", "“Is now” diikuti kata kerja berakhiran -ing: “writing”."]]}, {"title": "The Island Visit", "theme": "Travel & Discovery", "icon": "⛵", "color": "#087b86", "text": "During the holidays, Sara {0} a quiet island with her family. They travelled there by boat.\n\nThey stayed {1} a small hotel near the beach. Sara took many photographs and showed {2} to her cousins when she returned home.\n\nHer family enjoyed the trip so much that they are {3} to visit the island again next year.", "qs": [[["visited", "visits", "visiting"], 0, "The trip is finished, so use the past tense “visited”.", "Lawatan itu telah selesai, jadi gunakan bentuk lampau “visited”."], [["on", "in", "by"], 1, "We stay “in” a hotel.", "Kita menginap “in” sebuah hotel."], [["it", "her", "them"], 2, "“Photographs” is plural; use “them”.", "“Photographs” ialah jamak; gunakan “them”."], [["go", "going", "went"], 1, "The future plan uses “are going to”.", "Rancangan masa hadapan menggunakan “are going to”."]]}];let screen='start',setIndex=0,qi=0,records=[],complete=new Set(),selected=null,score=0;const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyhrggPL55jr-aZU0GdXyE1JEZOJS1Yid_y5sBkDTxf_b-ZO7-l91-ieG_Q7bzFJjvP/exec';let pupil={name:'',pupilClass:''},attempt=null,bridge=null,bridgeTimer=null;
function recordingMessage(){
const box=document.getElementById('recording-status');if(!box)return;
box.textContent=!SCORE_ENDPOINT?'Score recording is not connected yet. Your result has not been sent.':attempt?.status==='saved'?'✓ Your score has been recorded for Mr. Z.':attempt?.status==='failed'?'Your score is waiting to be sent. Reconnecting automatically…':'Sending your score to Mr. Z…';
}
function completeRecording(){
if(!attempt||attempt.payload)return;
attempt.finished=new Date().toISOString();
attempt.payload={id:attempt.id,name:pupil.name,pupilClass:pupil.pupilClass,started:attempt.started,finished:attempt.finished,answers:records.flatMap((set,si)=>set.map((r,qi)=>({history:[...r.wrong,sets[si].qs[qi][1]]})))};

}
function sendScore(){
if(!attempt?.payload||attempt.status==='saved'||!SCORE_ENDPOINT||!navigator.onLine)return;
if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(SCORE_ENDPOINT)){attempt.status='failed';recordingMessage();return}
clearTimeout(bridgeTimer);bridge?.remove();attempt.status='sending';recordingMessage();
bridge=document.createElement('iframe');bridge.hidden=true;bridge.title='Private score submission';bridge.src=SCORE_ENDPOINT+'?channel='+encodeURIComponent(attempt.id)+'&parentOrigin='+encodeURIComponent(location.origin);document.body.append(bridge);
bridgeTimer=setTimeout(()=>{if(attempt?.status==='saved')return;attempt.status='failed';recordingMessage();if(attempt.retries++<3)bridgeTimer=setTimeout(sendScore,10000)},30000);
}
window.addEventListener('message',e=>{
if(!attempt||!bridge||!e.data||e.data.channel!==attempt.id||!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin))return;
if(e.data.type==='score-ready')e.source.postMessage({type:'save-score',channel:attempt.id,payload:attempt.payload},e.origin);
else if(e.data.type==='score-saved'&&e.data.result?.ok&&e.data.result.id===attempt.id&&e.data.result.score===score){attempt.status='saved';clearTimeout(bridgeTimer);recordingMessage()}
else if(e.data.type==='score-error'){attempt.status='failed';recordingMessage()}
});
window.addEventListener('online',()=>{if(attempt?.status!=='saved')sendScore()});

function check(){let r=records[setIndex][qi],q=sets[setIndex].qs[qi];if(r.done||selected===null||r.wrong.includes(selected))return;if(selected===q[1]){r.done=true;r.star=r.wrong.length===0;if(r.star)score++}else r.wrong.push(selected);selected=null;render(false);document.querySelector('#feedback')?.focus()}
function render(focus=true){window.speechSynthesis?.cancel();let h='';if(screen==='pupil')h='<section class="card hero"><h1>Welcome, explorer!</h1><p>Enter your name and class.<br><span lang="ms">Isi nama dan kelas kamu.</span></p><form id="pupil-form"><label for="pupil-name">Name / Nama</label><input id="pupil-name" required maxlength="80" autocomplete="name" value="'+esc(pupil.name)+'"><label for="pupil-class">Class / Kelas</label><input id="pupil-class" required maxlength="40" placeholder="6 UM" value="'+esc(pupil.pupilClass)+'"><p>Your final mark is sent after all five worlds are complete.</p><button>CHOOSE MY WORLD →</button></form></section>';if(screen==='start')h='<section class="card hero"><p class="eyebrow">YEAR 6 · GRAMMAR CLOZE PRACTICE</p><h1>Open the Grammar Portals!</h1><div class="big-icon">🎸 🌱 🏃 🤖 ⛵</div><p>Five worlds. Five stories. Twenty missing words.<br>Choose the word that makes each sentence correct.</p><p>Each correct answer unlocks a portal.<br>⭐ Earn a star for a correct first attempt.</p><button id="start">CHOOSE MY WORLD →</button></section>';if(screen==='themes')h='<section class="card"><h1>Choose your world</h1><p>'+complete.size+' / 5 worlds complete · ⭐ '+score+' / 20</p><div class="themes">'+sets.map((s,i)=>'<button class="theme" data-set="'+i+'" style="'+(!complete.has(i)?'background:'+s.color:'')+'" '+(complete.has(i)?'disabled':'')+'><span>'+s.icon+'</span><strong>'+s.theme+'</strong><small>'+s.title+' · '+(complete.has(i)?'✓ Complete':'4 grammar portals')+'</small></button>').join('')+'</div></section>';if(screen==='game'){let s=sets[setIndex],r=records[setIndex][qi],q=s.qs[qi];h='<section class="card"><div class="hud"><strong>'+s.icon+' '+s.theme+'</strong><strong>⭐ '+score+' / 20</strong></div><div class="maze" aria-label="Four grammar portals">'+s.qs.map((_,i)=>'<span class="portal '+(records[setIndex][i].done?'done':i===qi?'active':'')+'" aria-label="Portal '+(i+1)+(records[setIndex][i].done?' completed':i===qi?' current':'')+'">'+(records[setIndex][i].done?'✓':i+1)+'</span>').join('')+'</div><h1>'+s.title+'</h1><div class="passage">'+passage(setIndex)+'</div><div class="passage-actions"><button class="secondary" id="read">🔊 Read passage</button><button class="secondary" id="worlds">WORLD MAP</button></div><div class="prompt"><h2 tabindex="-1" id="heading">Choose the word for blank '+(setIndex===0?qi+6:qi+1)+'.</h2><p lang="ms">Pilih perkataan yang betul untuk mengisi tempat kosong yang ditandakan.</p><div class="answer-row">'+q[0].map((w,k)=>'<button class="answer '+(selected===k?'selected':r.done&&k===q[1]?'good':r.wrong.includes(k)?'wrong':'')+'" data-answer="'+k+'" aria-pressed="'+(selected===k)+'" '+(r.done||r.wrong.includes(k)?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+k)+'</span>'+w+'</button>').join('')+'</div>'+(selected!==null&&!r.done?'<p>Your choice: <strong>'+q[0][selected]+'</strong></p><button id="check">CHECK &amp; OPEN PORTAL →</button>':'')+(r.done?'<div class="explainer" tabindex="-1" id="feedback" role="status"><strong>'+(r.star?'⭐ Portal opened!':'✓ Portal opened. Keep learning!')+'</strong><p>'+q[2]+'</p><p lang="ms">'+q[3]+'</p></div><button id="next">'+(qi===3?'COMPLETE THIS WORLD':'NEXT PORTAL →')+'</button>':r.wrong.length?'<div class="feedback" tabindex="-1" id="feedback" role="status">Try another word. Read the words before and after the blank.<br><span lang="ms">Cuba perkataan lain. Baca perkataan sebelum dan selepas tempat kosong.</span></div>':'')+'</div></section>'}if(screen==='worlddone'){let s=sets[setIndex];h='<section class="card"><div class="hero"><span class="big-icon">'+s.icon+'</span><h1>World complete!</h1><p>You opened all four portals.</p></div><h2>'+s.title+'</h2><div class="passage">'+passage(setIndex,true)+'</div><div class="actions"><button id="map">'+(complete.size===5?'SEE FINAL RESULTS':'CHOOSE ANOTHER WORLD')+'</button></div></section>'}if(screen==='results')h='<section class="card hero"><h1>Grammar explorer!</h1><div class="big-icon">🏆</div><div class="score">'+score+' / 20 ⭐</div><p>All five worlds are complete!</p><div id="recording-status" role="status" aria-live="polite"></div><div class="actions"><button id="again">PLAY AGAIN</button><button id="review" class="secondary">REVIEW ANSWERS</button></div></section>';if(screen==='review')h='<section class="card"><h1>Your grammar notebook</h1>'+sets.map((s,si)=>'<article class="review-block"><h2>'+s.icon+' '+s.title+'</h2><div class="passage">'+passage(si,true)+'</div>'+s.qs.map((q,n)=>'<p><strong>Blank '+(si===0?n+6:n+1)+': '+q[0][q[1]]+'</strong><br>'+q[2]+'<br><span lang="ms">'+q[3]+'</span></p>').join('')+'</article>').join('')+'<div class="actions"><button id="again">PLAY AGAIN</button><button id="back" class="secondary">BACK TO RESULTS</button></div></section>';app.innerHTML=h;if(screen==='results'){completeRecording();recordingMessage()}document.querySelector('#pupil-form')?.addEventListener('submit',e=>{e.preventDefault();let name=document.querySelector('#pupil-name').value.trim(),cl=document.querySelector('#pupil-class').value.trim();if(!name||!cl)return;pupil={name,pupilClass:cl};beginAttempt()});document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{setIndex=Number(b.dataset.set);qi=records[setIndex].findIndex(r=>!r.done);selected=null;screen='game';render()});for(let id of ['start','again'])document.getElementById(id)?.addEventListener('click',reset);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.answer)));document.querySelector('#check')?.addEventListener('click',check);document.querySelector('#next')?.addEventListener('click',()=>{if(!records[setIndex][qi].done)return;if(qi===3){complete.add(setIndex);screen='worlddone'}else qi++;selected=null;render()});document.querySelector('#map')?.addEventListener('click',()=>{screen=complete.size===5?'results':'themes';render()});document.querySelector('#worlds')?.addEventListener('click',()=>{screen='themes';render()});document.querySelector('#review')?.addEventListener('click',()=>{screen='review';render()});document.querySelector('#back')?.addEventListener('click',()=>{screen='results';render()});document.querySelector('#read')?.addEventListener('click',()=>say(sets[setIndex].text.replace(/\{\d\}/g,' blank ')));if(!window.speechSynthesis&&document.querySelector('#read')){document.querySelector('#read').disabled=true;document.querySelector('#read').textContent='Read aloud unavailable'}if(focus){window.scrollTo(0,0);let e=document.querySelector('#heading')||app.querySelector('h1');e?.setAttribute('tabindex','-1');e?.focus({preventScroll:true})}}
render();</script></body></html>
