:root{--ink:#17314c;--blue:#2655ce;--teal:#087b75;--gold:#ffce45}*{box-sizing:border-box}body{margin:0;background:#e9f5ff;color:var(--ink);font-family:Arial,sans-serif;font-size:18px;line-height:1.55;background-image:radial-gradient(#bfd9ed 1px,transparent 1px);background-size:24px 24px}header{background:#17314c;color:white;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header strong{font-size:22px}button,summary{cursor:pointer}button{font:inherit;font-weight:700;min-height:48px;border-radius:16px;padding:12px 20px;border:2px solid transparent;background:var(--blue);color:white;transition:background .2s}button:hover{filter:brightness(.94)}button:disabled{cursor:default;filter:none}button:focus-visible,summary:focus-visible{outline:4px solid #e4671e;outline-offset:4px}header button{background:white;color:var(--ink);font-size:15px;padding:8px 12px}main{max-width:1100px;margin:28px auto;padding:0 20px 40px}.card{background:#fffdf6;border:2px solid #b4d2e6;border-radius:28px;padding:32px;box-shadow:0 8px 0 #c5ddea}h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:16px 0}h2{line-height:1.3;font-size:clamp(23px,3vw,30px)}.eyebrow{font-weight:800;letter-spacing:2px;color:var(--teal);font-size:14px}.hero{text-align:center;max-width:830px;margin:auto}.lead{max-width:610px;margin:18px auto}.badge{background:var(--gold);border-radius:30px;padding:8px 16px;display:inline-block;font-weight:bold}.map{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:25px 0}.stop{width:52px;height:52px;border-radius:50%;background:#dce8ff;display:grid;place-items:center;font-weight:bold;border:3px solid #becded}.stop.active{border-color:var(--blue);background:var(--gold)}.stop.done{background:#c7eee3;border-color:var(--teal)}.hud{display:flex;justify-content:space-between;gap:10px;font-weight:bold}.bar{height:12px;background:#cedfeb;border-radius:10px;margin:12px 0;overflow:hidden}.bar span{display:block;background:var(--teal);height:100%}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.source{background:#e9f3ff;border:2px solid #7faae1;border-radius:22px;padding:22px}.source h2{margin-top:12px;color:#244abb}.text{white-space:pre-line}.answer{display:flex;align-items:center;gap:14px;width:100%;background:white;border:2px solid #b7cae0;color:var(--ink);text-align:left;margin:12px 0}.letter{background:#e4ebff;color:#244abb;border-radius:10px;min-width:38px;height:38px;display:grid;place-items:center}.answer.wrong{background:#fff0e9;border-color:#bd4c25}.answer.correct{background:#d9f4e8;border-color:var(--teal)}.feedback{padding:16px;border-radius:16px;background:#fff0cf;margin:18px 0}.feedback.good{background:#d9f4e8}details{margin:16px 0;background:#ffffffa8;border-radius:12px;padding:12px}summary{font-weight:bold;color:var(--teal)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.secondary{background:white;color:var(--blue);border-color:#9eb5df}.score{font-size:64px;font-weight:800;color:var(--teal)}.review{margin:18px 0;background:#eff5ff;border-radius:18px;padding:20px}.scene{width:100%;max-height:200px;display:block;border-radius:18px}.moving{animation:travel 4s ease-in-out infinite}.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}.wave{animation:wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.paused *{animation:none!important}@keyframes travel{50%{transform:translateX(12px)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@keyframes wave{50%{transform:rotate(12deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:700px){main{padding:0 12px 28px;margin-top:18px}.card{padding:20px;border-radius:22px}.layout{grid-template-columns:1fr}.scene{max-height:145px}header{padding:12px;gap:8px}header strong{font-size:18px}header button{font-size:13px} const questions=[{"title": "London Discovery", "icon": "📚", "head": "VISIT LONDON TODAY", "text": "Regent’s Park is a beautiful green area.\nNelson’s Column is a very tall monument.\nThe British Library has fourteen million books.", "ms": "Regent’s Park ialah kawasan hijau yang indah.\nNelson’s Column ialah monumen yang sangat tinggi.\nBritish Library mempunyai empat belas juta buku.", "q": "Where can you see fourteen million books?", "qm": "Di manakah anda boleh melihat empat belas juta buku?", "a": ["Regent's Park", "Nelson's Column", "The British Library"], "key": 2, "hint": "Read the sentence about books.", "why": "The text says the British Library has fourteen million books.", "scene": "library", "theme": "Reading Discoveries"}, {"title": "Ocean Adventure", "icon": "🚢", "head": "THE OCEAN STAR", "text": "This huge ship is like a moving city!\nIt has a park with real trees, twenty cafes, and five swimming pools.\nYou can relax because there is no school on the ship!", "ms": "Kapal yang besar ini seperti sebuah bandar bergerak!\nKapal ini mempunyai taman dengan pokok sebenar, dua puluh kafe dan lima kolam renang.\nAnda boleh berehat kerana tiada sekolah di atas kapal!", "q": "Why can children relax on this holiday ship?", "qm": "Mengapakah kanak-kanak boleh berehat di atas kapal percutian ini?", "a": ["It is huge.", "It has pools.", "There is no school."], "key": 2, "hint": "Look for the words “because there is”.", "why": "Children can relax because there is no school on the ship.", "scene": "ship", "theme": "Reading Discoveries"}, {"title": "A Family Message", "icon": "✉️", "head": "A Very Busy Family", "text": "From: amy@sunmail.com\nTo: sarah@sunmail.com\n\nHi Sarah,\nMr and Mrs Turner have a very large family. Life at home is noisy and fun, but going out together can be difficult. The family rarely go to the cinema because buying tickets for everyone is too expensive.\nTalk to you soon!\nAmy", "ms": "Daripada: Amy • Kepada: Sarah\n\nHai Sarah,\nEncik dan Puan Turner mempunyai keluarga yang sangat besar. Kehidupan di rumah riuh dan menyeronokkan, tetapi keluar bersama-sama boleh menjadi sukar. Keluarga itu jarang pergi ke pawagam kerana membeli tiket untuk semua orang terlalu mahal.\nJumpa lagi!\nAmy", "q": "Why does the Turner family rarely go to the cinema?", "qm": "Mengapakah keluarga Turner jarang pergi ke pawagam?", "a": ["It is too noisy .", "It is difficult to get there.", "It costs too much money."], "key": 2, "hint": "Find the reason after “because”.", "why": "Buying cinema tickets for everyone is too expensive.", "scene": "family", "theme": "Reading Discoveries"}, {"title": "School Fun Day", "icon": "🎪", "head": "HIGHFIELD SCHOOL: FUN DAY", "text": "Saturday 25th\n\nMORNING (9:00 a.m. – 12:00 p.m.)\n• Family sports competition\n• Face painting booth\n\nAFTERNOON (1:00 p.m. – 4:00 p.m.)\n• Mini zoo with farm animals\n• Costume dressing competition", "ms": "Sabtu, 25 haribulan\n\nPAGI (9.00 pagi – 12.00 tengah hari)\n• Pertandingan sukan keluarga\n• Gerai melukis muka\n\nPETANG (1.00 petang – 4.00 petang)\n• Zoo mini dengan haiwan ternakan\n• Pertandingan pakaian kostum", "q": "Adam can only visit the school in the afternoon. Which activity can he join?", "qm": "Adam hanya boleh melawat sekolah pada waktu petang. Aktiviti manakah yang boleh disertainya?", "a": ["Family sports competition", "Costume dressing competition", "Face painting booth"], "key": 1, "hint": "Check the AFTERNOON activities.", "why": "The costume dressing competition is in the afternoon, from 1:00 p.m. to 4:00 p.m.", "scene": "fair", "theme": "Reading Discoveries"}, {"title": "Wildlife Helpers", "icon": "🐟", "head": "Science Club Chat", "text": "Amir: Why is everyone reading news about the blobfish? It looks so weird!\n\nNita: That is the point! The news uses its funny looks to remind people that unusual wildlife needs our help to survive, just like cute pandas.", "ms": "Amir: Mengapakah semua orang membaca berita tentang ikan blobfish? Rupanya sangat pelik!\n\nNita: Itulah tujuannya! Berita itu menggunakan rupanya yang lucu untuk mengingatkan orang ramai bahawa hidupan liar yang luar biasa memerlukan bantuan kita untuk terus hidup, sama seperti panda yang comel.", "q": "Why is the news about the blobfish helpful?", "qm": "Mengapakah berita tentang ikan blobfish itu bermanfaat?", "a": ["It helps wildlife survive", "It shows why it looks weird", "It explains where pandas live"], "key": 0, "hint": "What does Nita say wildlife needs help to do?", "why": "The news reminds people to help unusual wildlife survive.", "scene": "fish", "theme": "Reading Discoveries"}, {"theme": "School and Clubs", "title": "Library Notice", "icon": "🏫", "head": "LIBRARY NOTICE", "text": "Please return your library books by Friday. The library is closed on Saturday.", "ms": "Sila pulangkan buku perpustakaan sebelum atau pada hari Jumaat. Perpustakaan ditutup pada hari Sabtu.", "q": "When must pupils return their books?", "qm": "Bilakah murid perlu memulangkan buku mereka?", "a": ["By Friday", "On Saturday", "On Sunday"], "key": 0, "hint": "Look for the return deadline.", "why": "The best answer is By Friday. Look for the return deadline.", "scene": "library"}, {"theme": "School and Clubs", "title": "Art Club", "icon": "🏫", "head": "ART CLUB", "text": "Art Club meets in Room 3 every Tuesday at 2 p.m. Bring coloured pencils. Paper will be provided.", "ms": "Kelab Seni bertemu di Bilik 3 setiap hari Selasa pada pukul 2 petang. Bawa pensel warna. Kertas akan disediakan.", "q": "What should pupils bring?", "qm": "Apakah yang perlu dibawa oleh murid?", "a": ["Paper", "Coloured pencils", "Paint"], "key": 1, "hint": "Check what pupils must bring.", "why": "The best answer is Coloured pencils. Check what pupils must bring.", "scene": "library"}, {"theme": "School and Clubs", "title": "Sports Update", "icon": "🏫", "head": "SPORTS UPDATE", "text": "Football practice is cancelled today because of heavy rain. Practice will continue next Monday.", "ms": "Latihan bola sepak dibatalkan hari ini kerana hujan lebat. Latihan akan diteruskan pada hari Isnin depan.", "q": "Why is practice cancelled?", "qm": "Mengapakah latihan dibatalkan?", "a": ["The coach is away", "The field is closed for repairs", "There is heavy rain"], "key": 2, "hint": "Find the reason after “because”.", "why": "The best answer is There is heavy rain. Find the reason after “because”.", "scene": "library"}, {"theme": "School and Clubs", "title": "Science Visit", "icon": "🏫", "head": "SCIENCE VISIT", "text": "The Science Club will visit a museum on Thursday. Meet at the school gate at 8 a.m. The bus leaves at 8.15 a.m.", "ms": "Kelab Sains akan melawat muzium pada hari Khamis. Berkumpul di pintu pagar sekolah pada pukul 8 pagi. Bas bertolak pada pukul 8.15 pagi.", "q": "Where should pupils meet?", "qm": "Di manakah murid perlu berkumpul?", "a": ["At the school gate", "Inside the museum", "At the library"], "key": 0, "hint": "Look for the meeting place.", "why": "The best answer is At the school gate. Look for the meeting place.", "scene": "library"}, {"theme": "School and Clubs", "title": "Lost Bottle", "icon": "🏫", "head": "LOST BOTTLE", "text": "Found: a blue water bottle near the hall. Its owner can collect it from the school office after lunch.", "ms": "Dijumpai: botol air biru berhampiran dewan. Pemiliknya boleh mengambilnya di pejabat sekolah selepas makan tengah hari.", "q": "When can the owner collect the bottle?", "qm": "Bilakah pemilik boleh mengambil botol itu?", "a": ["Before school", "After lunch", "During breakfast"], "key": 1, "hint": "Read the collection time.", "why": "The best answer is After lunch. Read the collection time.", "scene": "library"}, {"theme": "Family and Friends", "title": "A Helpful Brother", "icon": "🏠", "head": "A HELPFUL BROTHER", "text": "Aina: I cannot carry these boxes alone.\nHakim: I will help you after I finish my homework.", "ms": "Aina: Saya tidak dapat membawa kotak-kotak ini seorang diri.\nHakim: Saya akan membantu selepas saya menyiapkan kerja rumah.", "q": "What will Hakim do first?", "qm": "Apakah yang akan dilakukan oleh Hakim terlebih dahulu?", "a": ["Carry the boxes", "Watch television", "Finish his homework"], "key": 2, "hint": "What happens before helping?", "why": "The best answer is Finish his homework. What happens before helping?", "scene": "family"}, {"theme": "Family and Friends", "title": "Birthday Invitation", "icon": "🏠", "head": "BIRTHDAY INVITATION", "text": "Come to Mei’s birthday party on Sunday, from 3 p.m. to 5 p.m., at her house. Please tell Mei by Friday if you can come.", "ms": "Datanglah ke majlis hari jadi Mei pada hari Ahad, dari pukul 3 hingga 5 petang, di rumahnya. Sila beritahu Mei sebelum atau pada hari Jumaat jika anda boleh datang.", "q": "Where is the party?", "qm": "Di manakah majlis itu diadakan?", "a": ["At Mei’s house", "At school", "At a restaurant"], "key": 0, "hint": "Look for the party location.", "why": "The best answer is At Mei’s house. Look for the party location.", "scene": "family"}, {"theme": "Family and Friends", "title": "Grandma’s Visit", "icon": "🏠", "head": "GRANDMA’S VISIT", "text": "Grandma is arriving tomorrow morning. Dad will meet her at the bus station. We will have lunch together at home.", "ms": "Nenek akan tiba esok pagi. Ayah akan menjemputnya di stesen bas. Kami akan makan tengah hari bersama-sama di rumah.", "q": "Who will meet Grandma?", "qm": "Siapakah yang akan menjemput nenek?", "a": ["Mum", "Dad", "The teacher"], "key": 1, "hint": "Find who goes to the station.", "why": "The best answer is Dad. Find who goes to the station.", "scene": "family"}, {"theme": "Family and Friends", "title": "A Picnic Plan", "icon": "🏠", "head": "A PICNIC PLAN", "text": "Let’s have a picnic at the park. If it rains, we will eat at my house instead. Please bring a mat.", "ms": "Mari berkelah di taman. Jika hujan, kita akan makan di rumah saya. Sila bawa tikar.", "q": "What will they do if it rains?", "qm": "Apakah yang akan mereka lakukan jika hujan?", "a": ["Cancel lunch", "Stay in the park", "Eat at the house"], "key": 2, "hint": "Read the backup plan.", "why": "The best answer is Eat at the house. Read the backup plan.", "scene": "family"}, {"theme": "Family and Friends", "title": "Thank You Note", "icon": "🏠", "head": "THANK YOU NOTE", "text": "Dear Ravi, thank you for lending me your storybook. I enjoyed it and will return it tomorrow. From Adam.", "ms": "Ravi, terima kasih kerana meminjamkan buku cerita kepada saya. Saya suka membacanya dan akan memulangkannya esok. Daripada Adam.", "q": "Why is Adam thanking Ravi?", "qm": "Mengapakah Adam mengucapkan terima kasih kepada Ravi?", "a": ["Ravi lent him a book", "Ravi bought him lunch", "Ravi helped with maths"], "key": 0, "hint": "What did Ravi lend him?", "why": "The best answer is Ravi lent him a book. What did Ravi lend him?", "scene": "family"}, {"theme": "Animals and Nature", "title": "Keep the Park Clean", "icon": "🐾", "head": "KEEP THE PARK CLEAN", "text": "Please put rubbish in the bins. Plastic bags left on the ground can harm animals.", "ms": "Sila buang sampah ke dalam tong sampah. Beg plastik yang ditinggalkan di atas tanah boleh membahayakan haiwan.", "q": "Why should visitors use the bins?", "qm": "Mengapakah pengunjung patut menggunakan tong sampah?", "a": ["To feed animals", "To help keep animals safe", "To collect plastic bags"], "key": 1, "hint": "Think about the harm to animals.", "why": "The best answer is To help keep animals safe. Think about the harm to animals.", "scene": "fish"}, {"theme": "Animals and Nature", "title": "Zoo Notice", "icon": "🐾", "head": "ZOO NOTICE", "text": "The penguin feeding show starts at 11 a.m. Visitors must stay behind the fence and must not feed the penguins.", "ms": "Pertunjukan memberi makan penguin bermula pada pukul 11 pagi. Pengunjung mesti berada di belakang pagar dan tidak boleh memberi makan kepada penguin.", "q": "What must visitors NOT do?", "qm": "Apaka render=function(focus=true){document.body.dataset.theme=String(Math.floor(index/5));syncMusic();cancelAnimationFrame(frame);keys={left:false,right:false};if(screen==='pupil'){app.innerHTML='<section class="card hero"><h1>Ready, explorer?</h1><p>Enter your name and class before you start. Your final reading score will be sent automatically once recording is connected.</p><form id="pupil-form"><label for="pupil-name">Your name</label><input id="pupil-name" maxlength="80" required autocomplete="name" value="'+esc(pupil.name)+'"><label for="pupil-class">Your class</label><input id="pupil-class" maxlength="40" required placeholder="Example: 5 UM" value="'+esc(pupil.pupilClass)+'"><button>CHOOSE MY THEME →</button></form></section>';document.querySelector('#pupil-form').onsubmit=e=>{e.preventDefault();let name=document.querySelector('#pupil-name').value.trim(),cl=document.querySelector('#pupil-class').value.trim();if(!name||!cl)return;pupil={name,pupilClass:cl};beginAttempt()};return}if(screen==='themes'){app.innerHTML='<section class="card hero"><span class="eyebrow">CHOOSE YOUR NEXT ADVENTURE</span><h1>Which theme first?</h1><p>Finish all five missions in a theme. Completed themes stay locked until you play again.</p><p><strong>'+completedThemes.size+' / 6 themes complete · ⭐ '+score+' / 30</strong></p><div class="theme-grid">'+questions.filter((q,n)=>n%5===0).map((q,n)=>'<button class="theme-choice" data-theme-choice="'+n+'" '+(completedThemes.has(n)?'disabled':'')+'><span>'+['🧭','🏫','🏠','🌳','🍎','🚌'][n]+'</span><strong>'+esc(q.theme)+'</strong><small>'+(completedThemes.has(n)?'✓ Completed · Locked':'5 reading missions · Start here →')+'</small></button>').join('')+'</div></section>';app.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{let theme=Number(b.dataset.themeChoice);if(completedThemes.has(theme))return;index=theme*5;screen='adventure';worldReset();render()});if(focus){window.scrollTo(0,0);let h=app.querySelector('h1');h.tabIndex=-1;h.focus({pre app.innerHTML='<section class="card"><div class="hud"><span>🏝️ Island '+(index+1)+' · '+esc(questions[index].theme)+' · '+esc(questions[index].title)+'</span><span>⭐ '+score+' / 30</span></div><h2>Reach the reading flag!</h2><p class="island-note">'+['Easy start · Learn to jump','Coin quest · Collect 2 coins · 1 moving creature','Brave jumps · Collect 3 coins · 2 moving creatures','Quick feet · Collect 4 coins · 3 moving creatures','Final challenge · Collect 5 coins · 4 moving creatures'][index%5]+'</p><p class="island-note">Use the buttons below, or ← → and Space / ↑ on a keyboard. Collect coins, jump over water and hit a ? block from below, then catch its moving mushroom to grow! Falling returns you safely to land.</p><canvas id="world" width="800" height="400" tabindex="0" aria-label="Island platform adventure. Arrow keys move; Space jumps. Use the reading mission button to bypass jumping."></canvas><div class="controls"><div><button id="left" aria-label="Move left">◀</button> <button id="right" aria-label="Move right">▶</button></div><button id="jump">JUMP ↑</button></div><div class="hud"><span id="coins" class="coin">🪙 '+coinScore+' coins</span><button id="enter" disabled>Reach the flag →</button></div><details><summary>Prefer reading without jumping?</summary><p>You can open this island’s reading mission directly.</p><button id="direct">OPEN READING MISSION</button></details><p id="world-status" role="status"></p></section>';

function tick(t){if(screen!=='adventure')return;let dt=Math.min((t-(lastTime||t))/1000,.03);lastTime=t;if(!document.hidden)step(dt);draw(t);frame=requestAnimationFrame(tick)}
function step(dt){worldClock+=dt;hitCooldown=Math.max(0,hitCooldown-dt);let oldTop=player.y;if(jumpWanted&&player.ground){player.vy=-460;player.ground=false;tone(true)}jumpWanted=false;player.x=Math.max(0,Math.min(1550,player.x+((keys.right?1:0)-(keys.left?1:0))*230*dt));let before=player.y+44;player.vy+=1100*dt;player.y+=player.vy*dt;player.ground=false;for(const block of blocks){if(player.vy<0&&player.x+28>block.x&&player.x<block.x+32&&oldTop>=block.y+32&&player.y<=block.y+32){player.y=block.y+32;player.vy=60;if(!block.used){block.used=true;powerMushrooms.push({x:block.x+16,y:block.y-15,vy:-120,dir:1,taken:false});tone(true);document.querySelector('#world-status').textContent='A mushroom popped out! Chase it and catch it to grow!';}}}for(const g of grounds){if(player.x+28>g.x&&player.x<g.x+g.w&&player.vy>=0&&before<=g.y+1&&player.y+44>=g.y){player.y=g.y-44;player.vy=0;player.ground=true}}

for(const m of powerMushrooms){if(m.taken)continue;let previous=m.y+12;m.x+=m.dir*85*dt;if(m.x<15||m.x>1585){m.dir*=-1;m.x=Math.max(15,Math.min(1585,m.x))}m.vy+=800*dt;m.y+=m.vy*dt;let surfaces=grounds;for(const g of surfaces){if(m.x+12>g.x&&m.x-12<g.x+g.w&&m.vy>=0&&previous<=g.y+1&&m.y+12>=g.y){m.y=g.y-12;m.vy=0;let edge=m.dir>0?m.x+16:m.x-16;if(!surfaces.some(v=>edge>=v.x&&edge<=v.x+v.w&&Math.abs(v.y-g.y)<2))m.dir*=-1;}}if(m.y>440){let g=grounds.find(g=>m.x>=g.x&&m.x<=g.x+g.w)||grounds[0];m.x=g.x+g.w/2;m.y=g.y-12;m.vy=0}if(Math.abs(player.x+14-m.x)<28&&Math.abs(player.y+22-m.y)<36){m.taken=true;big=true;tone(true);document.querySelector('#world-status').textContent='Mushroom caught! Mario is bigger now!';}}

function drawTheme(c,theme,cam){c.save();c.translate(-cam*.25,0);function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function label(text,x,y){c.fillStyle='#17314c';c.font='bold 16px Arial';c.fillText(text,x,y)}

function draw(t){let cv=document.querySelector('#world');if(!cv)return;let c=cv.getContext('2d'),cam=Math.max(0,Math.min(800,player.x-260));c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,800,400);let theme=Math.floor(index/5);let bg=['#80ccff','#aad8ff','#ffdfba','#c6eeb4','#fff0af','#c8c5ff'][theme];c.fillStyle=bg;c.fillRect(0,0,800,400);c.fillStyle='#ffce45';c.beginPath();c.arc(690,55,30,0,7);c.fill();c.fillStyle='white';for(let i=0;i<4;i++){let x=i*240-cam*.2;c.beginPath();c.ellipse(x+60,70+i%2*35,55,17,0,0,7);c.fill()}drawTheme(c,theme,cam);c.fillStyle=['#2c92ce','#428fca','#6caec9','#358eb6','#e5a658','#5f65b8'][theme];c.fillRect(0,335,800,65);c.save();let viewW=innerWidth<600?520:800;cam=Math.max(0,Math.min(1600-viewW,player.x-viewW*.32));c.scale(800/viewW,1);c.translate(-cam,0);for(const g of grounds){c.fillStyle=['#c3844c','#bb7957','#cf8f62','#8b633d','#dfaf68','#8688ad'][theme];c.fillRect(g.x,g.y,g.w,g.h);c.fillStyle=['#16843c','#1764db','#cc6d43','#248239','#d89a20','#705bc5'][theme];c.fillRect(g.x,g.y,g.w,14);for(let x=g.x+10;x<g.x+g.w;x+=35){c.fillStyle='#e8b16d';c.fillRect(x,g.y+30,18,8)}}for(const g of grounds){let px=g.x+g.w-65;c.fillStyle='#2fac48';c.fillRect(px,g.y+16,40,45);c.fillStyle='#68dc6e';c.fillRect(px-5,g.y+15,50,13);c.fillStyle='#168c34';c.fillRect(px+32,g.y+28,8,33)}for(const block of blocks){c.fillStyle=block.used?'#b88150':'#f4b52d';c.fillRect(block.x,block.y,32,32);c.strokeStyle='#a26616';c.strokeRect(block.x,block.y,32,32);if(!block.used){c.fillStyle='white';c.font='bold 25px Arial';c.fillText('?',block.x+9,block.y+25)}}for(const land of [grounds[1],grounds[3]]){let mx=land.x+30,gy=land.y;c.fillStyle='#fff3d8';c.fillRect(mx-7,gy-20,14,20);c.fillStyle='#e53935';c.beginPath();c.ellipse(mx,gy-22,19,13,0,Math.PI,Math.PI*2);c.fill();c.fillStyle='white';c.beginPath();c.arc(mx,gy-29,5,0,7);c.fill()}for(const coin of coins)if(!coin.taken){c.fillStyle='#ffce45';c.beginPath();c.ellipse(coin.x,coin.y,10,14,0,0,7);c.fill();c.strokeStyle='#aa6f00';c.stroke();c.fillStyle='#9a6200';c.font='bold 16px Arial';c.fillText('★',coin.x-8,coin.y+5)}for(const m of powerMushrooms){if(m.taken)continue;c.fillStyle='#fff4dc';c.fillRect(m.x-8,m.y,16,12);c.fillStyle='#e53935';c.beginPath();c.ellipse(m.x,m.y,17,12,0,Math.PI,Math.PI*2);c.fill();c.fillStyle='white';c.beginPath();c.arc(m.x,m.y-6,4,0,7);c.fill();c.fillStyle='#17314c';c.fillRect(m.x-5,m.y+3,2,4);c.fillRect(m.x+3,m.y+3,2,4)}for(const h of hazards){c.fillStyle='#984724';c.beginPath();c.ellipse(h.x,h.y,18,15,0,0,7);c.fill();c.fillStyle='white';c.fillRect(h.x-10,h.y-8,7,8);c.fillRect(h.x+3,h.y-8,7,8);c.fillStyle='#17314c';c.fillRect(h.x-7,h.y-5,3,4);c.fillRect(h.x+4,h.y-5,3,4);c.fillRect(h.x-18,h.y+10,12,6);c.fillRect(h.x+6,h.y+10,12,6)}c.fillStyle='#17314c';c.fillRect(1460,210,5,110);c.fillStyle='#e76545';c.beginPath();c.moveTo(1465,210);c.lineTo(1530,225);c.lineTo(1465,250);c.fill();c.fillStyle='#17314c';c.font='bold 18px Arial';c.fillText('READ!',1430,195);c.save();if(big){c.translate(player.x+14,player.y+44);c.scale(1.5,1.5);c.translate(-player.x-14,-player.y-44)}let x=player.x,y=player.y;c.fillStyle='#df302d';c.fillRect(x+1,y+20,28,12);c.fillStyle='#2655ce';c.fillRect(x+5,y+25,20,13);c.fillRect(x+6,y+19,4,14);c.fillRect(x+21,y+19,4,14);c.fillStyle='#ffce45';c.fillRect(x+8,y+27,3,3);c.fillRect(x+21,y+27,3,3);c.fillStyle='#17314c';c.fillRect(x+3,y+36,9,8);c.fillRect(x+18,y+36,9,8);c.fillStyle='#f6c49a';c.beginPath();c.arc(x+15,y+11,12,0,7);c.fill();c.fillStyle='#df302d';c.fillRect(x+2,y-2,27,7);c.fillRect(x+5,y-6,20,5);c.fillStyle='white';c.beginPath();c.arc(x+15,y,4,0,7);c.fill();c.fillStyle='#df302d';c.font='bold 6px Arial';c.fillText('M',x+12,y+2);c.fillStyle='#562d20';c.fillRect(x+14,y+16,12,4);c.fillStyle='#f6c49a';c.fillRect(x+23,y+11,6,5);c.fillStyle='#17314c';c.fillRect(x+19,y+9,3,3);c.fillStyle='white';c.fillRect(x-2,y+24,7,8);c.fillRect(x+26,y+24,7,8);c.restore();c.restore()}

const arcadeNotes=[72,76,79,74,77,81,79,76,74,71,74,77,76,72,69,67,69,72,76,79,77,74,71,74,76,79,83,81,77,74,72,0];
function musicNote(midi,duration,type,volume){if(!musicContext||!midi)return;const o=musicContext.createOscillator(),g=musicContext.createGain(),now=musicContext.currentTime;o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(volume,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(musicContext.destination);musicNodes.add(o);o.onended=()=>{musicNodes.delete(o);o.disconnect();g.disconnect()};o.start(now);o.stop(now+duration+.03)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null;for(const o of musicNodes){try{o.stop()}catch{}}musicNodes.clear()}
function syncMusic(){stopMusic();if(!musicOn||!['adventure','game'].includes(screen)||document.hidden||!musicContext||musicContext.state!=='running')return;const suspense=screen==='game';const beat=()=>{if(suspense){musicNote([57,60,64,60,57,60,65,60,56,59,64,59,56,59,62,59][musicStep%16],.11,'triangle',.035);if(musicStep%4===0)musicNote([33,33,32,32][Math.floor(musicStep/8)%4],.25,'sine',.045)}else{musicNote(arcadeNotes[musicStep%32],.16,'square',.025);if(musicStep%2===0)musicNote([48,53,55,48][Math.floor(musicStep/8)%4],.23,'triangle',.045)}musicStep++};beat();musicTimer=setInterval(beat,suspense?145:185)}
document.querySelector('#music').onclick=async function(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;musicOn=!musicOn;try{if(musicOn){if(!musicContext)musicContext=new A();await musicContext.resume()}this.textContent=musicOn?'Music: on':'Music: off';this.setAttribute('aria-pressed',musicOn);syncMusic()}catch{musicOn=false;stopMusic();this.textContent='Music unavailable';this.setAttribute('aria-pressed','false')}};
if(!(window.AudioContext||window.webkitAudioContext)){document.querySelector('#music').disabled=true;document.querySelector('#music').textContent='Music unavailable'}
document.addEventListener('visibilitychange',syncMusic);window.addEventListener('pagehide',stopMusic);

document.querySelector('#motion').onclick=function(){paused=!paused;app.classList.toggle('paused',paused);this.textContent=paused?'Resume images':'Pause images';this.setAttribute('aria-pressed',paused)};document.querySelector('#sound').onclick=function(){sound=!sound;this.textContent=sound?'Sound: on':'Sound: off';this.setAttribute('aria-pressed',sound)};render();
