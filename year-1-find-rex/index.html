const story=["Tommy has a pet hamster. His name is Rex. Rex is small and black.", "Rex likes to hide.", "Tommy looks under the desk. Rex is not there.", "Tommy looks in his green school bag.", "Rex is sleeping in the bag!", "Tommy is happy."],malay=["Tommy mempunyai hamster peliharaan. Namanya Rex. Rex kecil dan hitam.", "Rex suka bersembunyi.", "Tommy melihat di bawah meja. Rex tiada di situ.", "Tommy melihat di dalam beg sekolahnya yang hijau.", "Rex sedang tidur di dalam beg!", "Tommy gembira."],questions=[{"n": "14", "q": "Tommy has a pet __________ .", "ms": "Tommy mempunyai __________ peliharaan.", "key": "hamster", "hint": "Read the first sentence. The animal is a hamster.", "scene": 0}, {"n": "15", "q": "Rex is small and black", "ms": "Rex kecil dan hitam.", "a": ["Yes", "No"], "key": 0, "hint": "The story says: Rex is small and black.", "scene": 0}, {"n": "16", "q": "Tommy looks under the desk", "ms": "Tommy melihat di bawah meja.", "a": ["Yes", "No"], "key": 0, "hint": "Tommy looks under the desk, but Rex is not there.", "scene": 2}, {"n": "17", "q": "Rex is in a red school bag.", "ms": "Rex berada di dalam beg sekolah merah.", "a": ["Yes", "No"], "key": 1, "hint": "Tommy’s school bag is green.", "scene": 4}, {"n": "18", "q": "Tommy is happy when he finds Rex.", "ms": "Tommy gembira apabila dia menemui Rex.", "a": ["Yes", "No"], "key": 0, "hint": "The last sentence says: Tommy is happy.", "scene": 5}, {"n": "19(i)", "q": "Do you think Rex is a good pet?", "ms": "Adakah anda fikir Rex haiwan peliharaan yang baik?", "a": ["Yes", "No"], "key": null, "hint": "This is your opinion. Both choices are welcome.", "scene": 5}, {"n": "19(ii)", "q": "Why?", "ms": "Mengapa?", "a": ["Because Tommy is happy.", "Because Tommy is sad."], "key": 0, "hint": "In the story, Tommy is happy when he finds Rex.", "scene": 5}];let screen='start',index=0,score=0,records=[],paused=false;const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function illustration(n){
const boy='<g transform="translate(40 55)"><path d="M-22 130V75Q0 55 24 75V130" fill="#e75a2d"/><circle cx="0" cy="40" r="26" fill="#f4c39a"/><path d="M-26 34Q-28 0 5 10L20 3 17 18 29 20 23 35 10 24-7 30Z" fill="#513629"/><g class="blink" fill="#173a51"><circle cx="-9" cy="39" r="3"/><circle cx="10" cy="39" r="3"/></g><path d="M-9 50Q0 61 10 50" fill="none" stroke="#713e27" stroke-width="3"/><path d="M17 80L54 97" stroke="#f4c39a" stroke-width="12" stroke-linecap="round"/><text x="-24" y="159" font-size="14" fill="#173a51">Tommy</text></g>';
function hamster(x,y,sleep=false,scale=1){return '<g transform="translate('+x+' '+y+') scale('+scale+')"><ellipse cy="8" rx="34" ry="27" fill="#252a32"/><circle cx="-23" cy="-15" r="11" fill="#252a32"/><circle cx="23" cy="-15" r="11" fill="#252a32"/><circle cx="-23" cy="-15" r="6" fill="#c5a6b0"/><circle cx="23" cy="-15" r="6" fill="#c5a6b0"/><ellipse cx="-13" cy="16" rx="13" ry="10" fill="#9ba0a7"/><ellipse cx="13" cy="16" rx="13" ry="10" fill="#9ba0a7"/><g class="blink">'+(sleep?'<path d="M-20 2Q-14-4-8 2M8 2Q14-4 20 2" fill="none" stroke="white" stroke-width="2"/>':'<g fill="black"><circle cx="-14" r="5"/><circle cx="14" r="5"/></g><g fill="white"><circle cx="-15" cy="-2" r="2"/><circle cx="13" cy="-2" r="2"/></g>')+'</g><ellipse class="sniff" cy="12" rx="4" ry="3" fill="#e5acb8"/><path d="M-14 15L-43 11M-14 20L-43 24M14 15L43 11M14 20L43 24" stroke="#173a51" stroke-width="1.5"/><ellipse cx="-19" cy="31" rx="9" ry="4" fill="#a6a1a6"/><ellipse cx="19" cy="31" rx="9" ry="4" fill="#a6a1a6"/></g>'}
let art='';if(n===0)art=boy+'<path d="M79 165Q105 177 142 165" fill="none" stroke="#f4c39a" stroke-width="14" stroke-linecap="round"/>'+hamster(115,143,false,.75)+'<text x="170" y="88" font-size="19" fill="#173a51">Rex</text><text x="170" y="116" font-size="17" fill="#173a51">Small • Black</text><text x="170" y="144" font-size="17" fill="#173a51">A pet hamster</text>';
if(n===1)art='<rect x="90" y="65" width="210" height="15" rx="3" fill="#d6904b"/><path d="M105 80V185M285 80V185" stroke="#a76e38" stroke-width="10"/>'+hamster(215,145)+'<text x="115" y="42" font-size="18" fill="#173a51">Rex likes to hide.</text>';
if(n===2)art=boy+'<rect x="130" y="85" width="200" height="15" rx="3" fill="#d6904b"/><path d="M145 100V185M315 100V185" stroke="#a76e38" stroke-width="10"/><text x="192" y="149" font-size="35" fill="#6435b5">?</text><text x="152" y="210" font-size="17" fill="#173a51">Rex is not here.</text>';
if(n>=3)art=boy+'<path d="M135 100Q135 64 220 64T305 100V190H135Z" fill="#22984c" stroke="#116a31" stroke-width="4"/><path d="M195 66V43Q220 27 245 43V66" fill="none" stroke="#116a31" stroke-width="8"/><ellipse cx="220" cy="110" rx="67" ry="34" fill="#113b28"/>'+((n===4||n===5)?hamster(220,112,n===4,.8):'<text x="207" y="120" font-size="33" fill="white">?</text>')+'<rect x="165" y="153" width="110" height="30" rx="7" fill="#5ec676"/><path d="M172 160H268" stroke="#156d33" stroke-width="3"/>'+(n===4?'<text class="zzz" x="270" y="58" font-size="23" fill="#6435b5">Z z z</text>':'')+(n===5?'<text x="310" y="58" font-size="26" fill="#d94720">♥</text>':'');
return '<svg class="scene" role="img" aria-label="'+['Tommy holds his small black hamster Rex','Rex hides under a desk earlier in the story','Tommy checks under the desk. Rex is not there','Tommy looks in his green school bag','Rex sleeps in the green school bag','Tommy is happy to find Rex in the green bag'][n]+'" viewBox="0 0 360 240"><rect width="360" height="240" rx="20" fill="#fce3a0"/><rect y="190" width="360" height="50" fill="#dcb77b"/><path d="M0 190H360" stroke="#ba945e" stroke-width="3"/>'+art+'</svg>'}
function storyView(){return '<div class="storygrid">'+story.map((t,n)=>'<article class="panel">'+illustration(n)+'<p>'+esc(t)+'</p><details><summary>Bahasa Melayu</summary><p lang="ms">'+esc(malay[n])+'</p></details></article>').join('')+'</div>'}
const SCORE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx8GPnC-1slCM8illEMdMWwIjPs_7rNEXjPG7B6DdGoV8B3a_fBvoy9S5fqUEWkNVIYxw/exec';let pupil={name:'',pupilClass:''},attempt=null,bridge=null,bridgeTimer=null;
function recordingMessage(){
const box=document.getElementById('recording-status');if(!box)return;
box.textContent=!SCORE_ENDPOINT?'Score recording is not connected yet. Your result has not been sent.':attempt?.status==='saved'?'✓ Your score has been recorded for Mr. Z.':attempt?.status==='failed'?'Your score is waiting to be sent. Reconnecting automatically…':'Sending your score to Mr. Z…';
}
function completeRecording(){
if(!attempt||attempt.payload)return;
attempt.finished=new Date().toISOString();
attempt.payload={id:attempt.id,name:pupil.name,pupilClass:pupil.pupilClass,started:attempt.started,finished:attempt.finished,answers:records.map(r=>[...r.wrong,r.choice])};
if(SCORE_ENDPOINT)sendScore();
}
function sendScore(){
if(!attempt?.payload||attempt.status==='saved'||!SCORE_ENDPOINT||!navigator.onLine)return;
if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(SCORE_ENDPOINT)){attempt.status='failed';recordingMessage();return}
clearTimeout(bridgeTimer);bridge?.remove();attempt.status='sending';recordingMessage();
bridge=document.createElement('iframe');bridge.hidden=true;bridge.title='Private score submission';bridge.src=SCORE_ENDPOINT+'?channel='+encodeURIComponent(attempt.id)+'&parentOrigin='+encodeURIComponent(location.origin);document.body.append(bridge);
bridgeTimer=setTimeout(()=>{if(attempt?.status==='saved')return;attempt.status='failed';recordingMessage();if(attempt.retries++<3)bridgeTimer=setTimeout(sendScore,10000)},30000);
}
window.addEventListener('message',e=>{
if(!attempt||!bridge||!e.data||e.data.channel!==attempt.id||!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin))return;
if(e.data.type==='score-ready')e.source.postMessage({type:'save-score',channel:attempt.id,payload:attempt.payload},e.origin);
else if(e.data.type==='score-saved'&&e.data.result?.ok&&e.data.result.id===attempt.id&&e.data.result.score===score){attempt.status='saved';clearTimeout(bridgeTimer);recordingMessage()}
else if(e.data.type==='score-error'){attempt.status='failed';recordingMessage()}
});
window.addEventListener('online',()=>{if(attempt?.status!=='saved')sendScore()});


function start(){screen="pupil";render()}
function read(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.75;window.speechSynthesis.speak(u)}
function beginGame(){clearTimeout(bridgeTimer);bridge?.remove();bridge=null;attempt={id:crypto.randomUUID?.()||("attempt-"+Date.now()+"-"+Math.random().toString(36).slice(2)),started:new Date().toISOString(),status:"idle",payload:null,retries:0};index=0;score=0;records=questions.map(()=>({wrong:[],done:false,star:false,choice:null}));screen='story';render()}
function answer(k){let q=questions[index],r=records[index];if(r.done||r.wrong.includes(k))return;if(q.key===null||k===q.key){r.done=true;r.choice=k;r.star=q.key!==null&&r.wrong.length===0;if(r.star)score++}else r.wrong.push(k);render(false);document.querySelector('#feedback')?.focus()}
function render(focus=true){window.speechSynthesis?.cancel();let h='';if(screen==='pupil')h='<section class="card hero"><h1>Hello, explorer!</h1><p>Tell us your name and class.</p><form id="pupil-form"><label for="pupil-name">Your name / Nama</label><input id="pupil-name" maxlength="80" autocomplete="name" required value="'+esc(pupil.name)+'"><label for="pupil-class">Your class / Kelas</label><input id="pupil-class" maxlength="40" required placeholder="Example: 1 UTHM" value="'+esc(pupil.pupilClass)+'"><button>LET’S READ →</button></form></section>';if(screen==='start')h='<section class="card hero"><span class="eyebrow">YEAR 1 · PART 3 PRACTICE · THE ENGLISH LAB</span><h1>Where is Rex?</h1>'+illustration(0)+'<p>Read Tommy’s story.<br>Help him find his little pet!</p><p>⭐ Earn up to 6 reading stars.<br>One question asks what you think.</p><button id="start">LET’S PLAY!</button></section>';if(screen==='story')h='<section class="card"><h1>Tommy’s Pet</h1><div class="actions"><button id="read" class="secondary">🔊 Read the story</button><button id="begin-top">ANSWER THE QUESTIONS →</button></div><p>Read the pictures below, then tap “Answer the questions”.</p>'+storyView()+'<div class="actions"><button id="begin">ANSWER THE QUESTIONS →</button></div></section>';if(screen==='game'){let q=questions[index],r=records[index];h='<section class="card"><div class="hud"><strong>Question '+q.n+'</strong><strong>⭐ '+score+' / 6</strong></div><div class="bar" role="progressbar" aria-label="Questions completed" aria-valuemin="0" aria-valuemax="7" aria-valuenow="'+records.filter(r=>r.done).length+'"><span style="width:'+records.filter(r=>r.done).length/7*100+'%"></span></div>'+illustration(q.scene)+'<h2 id="heading" tabindex="-1">'+esc(q.q)+'</h2><button id="read" class="secondary">🔊 Listen</button><p class="question-malay" lang="ms"><strong>Maksud:</strong> '+esc(q.ms)+'</p><details><summary>📖 Read the story again</summary>'+storyView()+'</details>'+(q.n==='14'?'<form id="word"><label for="word-answer">Write ONE word from the story.</label><input id="word-answer" autocomplete="off" autocapitalize="none" spellcheck="false" required '+(r.done?'disabled':'')+'><button '+(r.done?'disabled':'')+'>CHECK MY WORD</button></form>':q.a.map((t,k)=>'<button class="answer '+(r.wrong.includes(k)?'wrong':r.done&&k===r.choice?'good':'')+'" data-answer="'+k+'" '+(r.done||r.wrong.includes(k)?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+k)+'</span>'+esc(t)+'</button>').join(''))+(r.done?'<div class="feedback" id="feedback" role="status" tabindex="-1">'+(q.key===null?'Thank you! That is your opinion. No star is needed for this question.':(r.star?'Well done! ⭐':'You found it! Keep learning.'))+'</div><button id="next">'+(index===6?'SEE MY STARS':'NEXT →')+'</button>':r.wrong.length?'<div class="feedback" id="feedback" role="status" tabindex="-1">Try again. '+esc(q.hint)+'</div>':'')+'</section>'}if(screen==='results')h='<section class="card hero"><h1>Well done!</h1>'+illustration(5)+'<div class="score">'+score+' / 6 ⭐</div><p>You finished Tommy’s story!</p><div id="recording-status" role="status" aria-live="polite"></div><p>Stars are for six reading answers.<br>Your opinion is welcome too.</p><div class="actions"><button id="again">PLAY AGAIN</button><button id="review" class="secondary">REVIEW ANSWERS</button></div></section>';if(screen==='review')h='<section class="card"><h1>Our answers</h1>'+questions.map((q,n)=>'<article class="panel" style="margin:16px 0"><strong>Question '+q.n+'</strong><p>'+esc(q.q)+'</p><p>✓ '+(q.key===null?'Your opinion: '+esc(q.a[records[n].choice]):esc(q.a?q.a[q.key]:q.key))+'</p><p>'+esc(q.hint)+'</p></article>').join('')+'<div class="actions"><button id="again">PLAY AGAIN</button><button id="back" class="secondary">BACK TO STARS</button></div></section>';app.innerHTML=h;if(screen==='results'){completeRecording();recordingMessage()}document.querySelector('#pupil-form')?.addEventListener('submit',e=>{e.preventDefault();let name=document.querySelector('#pupil-name').value.trim(),cl=document.querySelector('#pupil-class').value.trim();if(!name||!cl)return;pupil={name,pupilClass:cl};beginGame()});app.classList.toggle('paused',paused);document.querySelector('#start')?.addEventListener('click',start);document.querySelector('#again')?.addEventListener('click',start);document.querySelector('#begin-top')?.addEventListener('click',()=>{screen='game';render()});document.querySelector('#begin')?.addEventListener('click',()=>{screen='game';render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));document.querySelector('#word')?.addEventListener('submit',e=>{e.preventDefault();answer(document.querySelector('#word-answer').value.trim().toLowerCase())});document.querySelector('#next')?.addEventListener('click',()=>{if(!records[index].done)return;if(index===6)screen='results';else index++;render()});document.querySelector('#review')?.addEventListener('click',()=>{screen='review';render()});document.querySelector('#back')?.addEventListener('click',()=>{screen='results';render()});let rb=document.querySelector('#read');if(rb){rb.onclick=()=>read(screen==='story'?story.join(' '):questions[index].q+(questions[index].a?' '+questions[index].a.join('. '):''));if(!window.speechSynthesis){rb.disabled=true;rb.textContent='Read aloud unavailable'}}if(focus){window.scrollTo(0,0);let el=document.querySelector('#heading')||app.querySelector('h1');el?.setAttribute('tabindex','-1');el?.focus({preventScroll:true})}}
document.querySelector('#motion').onclick=function(){paused=!paused;app.classList.toggle('paused',paused);this.textContent=paused?'Resume images':'Pause images';this.setAttribute('aria-pressed',paused)};render();
